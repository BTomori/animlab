<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnimLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
<!-- @include css/00-base.css -->
<!-- @include css/01-topbar.css -->
<!-- @include css/02-layout.css -->
<!-- @include css/03-side-panel.css -->
<!-- @include css/04-graph-strip.css -->
<!-- @include css/05-canvas-only.css -->
<!-- @include css/06-gallery.css -->
</style>
</head>
<body>
<header class="topbar">
  <div class="brand" aria-label="AnimLab">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1.5" y="1.5" width="29" height="29" rx="7" fill="var(--accent)"/><circle cx="16" cy="16" r="8" fill="none" stroke="var(--accent-ink)" stroke-width="2"/><path d="M10.3 21.7 21.7 10.3" stroke="var(--accent-ink)" stroke-width="2.6" stroke-linecap="round"/><circle cx="21.7" cy="10.3" r="2.6" fill="var(--accent-ink)"/></svg>
    AnimLab
  </div>
  <button class="btn icon tb-more" id="btnMore" type="button" aria-expanded="false" data-i18n-title="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <input id="sceneName" class="scene-name" data-i18n-ph="sceneName" data-i18n-title="sceneName">
  <button class="btn" id="btnGallery" type="button" data-i18n="gallery"></button>
  <div class="tb-group">
    <button class="btn" id="btnNew" type="button" data-i18n="new"></button>
    <button class="btn" id="btnOpen" type="button" data-i18n="open"></button>
    <button class="btn primary" id="btnSave" type="button" data-i18n="save"></button>
    <div class="menu">
      <button class="btn" id="btnExport" type="button" aria-haspopup="true" aria-expanded="false"><span data-i18n="export"></span> ▾</button>
      <div class="menu-pop" id="exportMenu" hidden>
        <button type="button" id="exVideo"><span id="exVideoLbl"></span><small data-i18n="exVideoSub"></small></button>
        <button type="button" id="exPng"><span data-i18n="exPng"></span><small data-i18n="exPngSub"></small></button>
        <button type="button" id="exHtml"><span data-i18n="exHtml"></span><small data-i18n="exHtmlSub"></small></button>
        <button type="button" id="exShare"><span data-i18n="exShare"></span><small data-i18n="exShareSub"></small></button>
      </div>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="hu">HU</button>
    <button type="button" data-lang="en">EN</button>
  </div>
  <input type="file" id="fileOpen" accept=".json,.html,.htm,application/json,text/html" hidden>
</header>

<!-- Példagaléria / example gallery -->
<div class="gal-back" id="galleryPanel" hidden>
  <div class="gal" role="dialog" aria-modal="true" aria-labelledby="galTitle" tabindex="-1">
    <div class="gal-head">
      <h2 id="galTitle" data-i18n="galleryTitle"></h2>
      <button class="btn" id="galClose" type="button" data-i18n="galleryClose"></button>
    </div>
    <div class="gal-filters">
      <div class="gal-seg" id="galGroup" role="group">
        <button type="button" data-group="all" data-i18n="galleryAll"></button>
        <button type="button" data-group="teacher" data-i18n="galleryTeacher"></button>
        <button type="button" data-group="students" data-i18n="galleryStudent"></button>
      </div>
      <input id="galSearch" class="gal-search" type="search" data-i18n-ph="gallerySearch" data-i18n-title="gallerySearch">
      <div class="gal-chips" id="galTopics" role="group" data-i18n-title="galleryTopics" hidden></div>
    </div>
    <div class="gal-status" id="galStatus" role="status" hidden></div>
    <div class="gal-list" id="galList"></div>
  </div>
</div>

<main class="layout">
  <section class="stage-col" id="stageCol">
    <div class="stage-wrap" id="stageWrap">
      <canvas id="stage"></canvas>
      <!-- Csak-vászon módban (teljes képernyő, fekvő telefon) ezek a gombok úsznak a kép fölött -->
      <!-- In canvas-only mode (full screen, phone in landscape) these buttons float over the picture -->
      <div class="cv-overlay" id="cvOverlay">
        <button class="btn icon" id="cvPlay" type="button" data-i18n-title="play"></button>
        <button class="btn icon" id="cvReset" type="button" data-i18n-title="resetT"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></button>
        <button class="btn icon" id="cvMenu" type="button" data-i18n-title="tabControls"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/><circle cx="9" cy="7" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="8" cy="17" r="2" fill="currentColor"/></svg></button>
        <button class="btn icon" id="cvExit" type="button" data-i18n-title="cvExit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
      </div>
      <!-- Billentyűzet: a kiválasztott csúszka (1–9, majd ← →) és érintőgombok a key() / onKey() jelenetekhez -->
      <!-- Keyboard: the selected slider (1–9, then ← →) and touch buttons for key() / onKey() scenes -->
      <div class="kb-hud" id="kbHud" hidden><b></b><small></small></div>
      <div class="kb-pad" id="kbPad" hidden></div>
      <!-- A jelenet billentyűparancsai: ⌨ gomb és lenyíló lista / the scene's keyboard commands: ⌨ button and drop-down list -->
      <button class="kb-help-btn" id="kbHelpBtn" type="button" aria-expanded="false" data-i18n-title="kbListTip" hidden>⌨</button>
      <div class="kb-list" id="kbList" hidden></div>
      <button class="rec-badge" id="recBadge" type="button" hidden>● REC</button>
      <div class="stage-err" id="stageErr" hidden></div>
    </div>
    <div class="transport">
      <button class="btn icon" id="btPlay" type="button" data-i18n-title="play"></button>
      <button class="btn icon" id="btStep" type="button" data-i18n-title="step"><svg viewBox="0 0 24 24"><path d="M6 5v14l9-7z" fill="currentColor"/><rect x="16" y="5" width="2.6" height="14" fill="currentColor"/></svg></button>
      <button class="btn icon" id="btReset" type="button" data-i18n-title="resetT"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></button>
      <button class="btn icon" id="btFull" type="button" data-i18n-title="full"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="btn icon" id="btCanvasFull" type="button" data-i18n-title="fullCanvas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9V8h2M17 9V8h-2M7 15v1h2M17 15v1h-2"/></svg></button>
      <span class="time" id="timeLbl">t = 0.00 s</span>
      <label class="speed" for="speed"><span data-i18n="speed"></span>
        <input type="range" id="speed" min="-10" max="1" step="0.01" value="0">
        <output id="speedOut">1×</output>
      </label>
    </div>
    <div class="hsplit" id="plotSplit" role="separator" aria-orientation="horizontal" tabindex="0" data-i18n-title="plotSplit" hidden></div>
    <div class="plots" id="plotsWrap" hidden><canvas id="plot"></canvas></div>
  </section>

  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-title="splitter"></div>

  <aside class="side">
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="controls" data-i18n="tabControls"></button>
      <button type="button" role="tab" data-tab="code" data-i18n="tabCode"></button>
      <button type="button" role="tab" data-tab="assets" data-i18n="tabAssets"></button>
      <button type="button" role="tab" data-tab="marks" data-i18n="tabMarks"></button>
      <button type="button" role="tab" data-tab="help" data-i18n="tabHelp"></button>
    </nav>
    <div class="tab-panel" id="tab-controls" role="tabpanel">
      <div class="panel-h" data-i18n="params"></div>
      <div id="controls"></div>
      <details class="kbhelp" id="kbHelp" hidden><summary></summary><div></div></details>
      <div class="panel-h" data-i18n="readouts"></div>
      <div id="readouts"></div>
    </div>
    <div class="tab-panel" id="tab-code" role="tabpanel" hidden>
      <div class="code-bar">
        <button class="btn primary" id="btRun" type="button"><svg viewBox="0 0 24 24"><path d="M7 5v14l11-7z" fill="currentColor"/></svg><span data-i18n="run"></span></button>
        <span class="code-state" id="codeState"></span>
      </div>
      <div class="editor">
        <pre class="gutter" id="gutter" aria-hidden="true">1</pre>
        <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" data-i18n-title="tabCode"></textarea>
      </div>
      <pre class="code-err" id="codeErr" hidden></pre>
    </div>
    <div class="tab-panel" id="tab-assets" role="tabpanel" hidden>
      <label class="drop" for="imgIn"><b data-i18n="drop"></b><span class="muted" data-i18n="dropSub"></span></label>
      <input type="file" id="imgIn" accept="image/png,image/jpeg,image/svg+xml,image/webp,image/gif" multiple hidden>
      <div id="assetList"></div>
    </div>
    <div class="tab-panel" id="tab-marks" role="tabpanel" hidden>
      <p class="muted" data-i18n="marksIntro"></p>
      <div class="tools" role="toolbar">
        <button type="button" class="btn" data-tool="move" data-i18n="tMove"></button>
        <button type="button" class="btn" data-tool="arrow" data-i18n="tArrow"></button>
        <button type="button" class="btn" data-tool="loop" data-i18n="tLoop"></button>
        <button type="button" class="btn" data-tool="path" data-i18n="tPath"></button>
        <button type="button" class="btn" data-tool="text" data-i18n="tText"></button>
        <button type="button" class="btn" data-tool="pick" data-i18n="tPick"></button>
      </div>
      <p class="tool-hint" id="toolHint"></p>
      <p class="vars" id="markVars"></p>
      <div class="coord" id="markCoord">x = –   y = –</div>
      <div id="markList"></div>
      <details class="codemarks" id="boundBox" open>
        <summary><span data-i18n="bTitle"></span> (<span id="bCount">0</span>)</summary>
        <p class="muted" data-i18n="bIntro"></p>
        <div id="boundList"></div>
      </details>
      <details class="codemarks" id="codeMarksBox" open>
        <summary><span data-i18n="cmTitle"></span> (<span id="cmCount">0</span>)</summary>
        <p class="muted" data-i18n="cmIntro"></p>
        <div id="codeMarkList"></div>
        <button type="button" class="link-btn" id="cmReset" data-i18n="cmReset"></button>
      </details>
      <div class="ctl-buttons">
        <button type="button" class="btn" id="marksCopy" data-i18n="mCopy"></button>
        <button type="button" class="btn" id="marksToCode" data-i18n="mToCode"></button>
        <button type="button" class="btn" id="marksClear" data-i18n="mClear"></button>
      </div>
    </div>
    <div class="tab-panel" id="tab-help" role="tabpanel" hidden>
      <div id="help" class="help"></div>
    </div>
  </aside>
</main>
<!-- Mobil nézet: alsó sáv a vászon és a menük közötti váltáshoz / mobile view: bottom bar to switch between canvas and menus -->
<nav class="mnav" id="mnav" aria-label="AnimLab">
  <button type="button" data-view="canvas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m8 15 3-4 2.5 3 2-2 2.5 3"/></svg><span data-i18n="mCanvas"></span></button>
  <button type="button" data-view="controls"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/><circle cx="9" cy="7" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="8" cy="17" r="2" fill="currentColor"/></svg><span data-i18n="tabControls"></span></button>
  <button type="button" data-view="code"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M13.5 6l-3 12"/></svg><span data-i18n="tabCode"></span></button>
  <button type="button" data-view="assets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 17-5-5-9 8"/></svg><span data-i18n="tabAssets"></span></button>
  <button type="button" data-view="marks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 18 6M18 6h-6M18 6v6"/></svg><span data-i18n="tabMarks"></span></button>
  <button type="button" data-view="help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg><span data-i18n="tabHelp"></span></button>
</nav>
<div id="toast" class="toast" role="status" hidden></div>

<script type="application/json" id="embedded-scene" data-app></script>












<script type="text/plain" id="ai-instructions" data-app><!-- @include ../docs/animlab-ai-instructions.md -->
</script>

</body>
</html>
