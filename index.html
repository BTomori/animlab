    else if (m.type === 'text') L.push(`  text(${interpCode(m.text)}, ${m.pts[0][0]}, ${m.pts[0][1]}, {size: ${m.size ?? 22}, bold: true, color: ${col}, align: "center", baseline: "middle"});`);
    if (+m.spin) L.push(`  // ${LANG === 'hu' ? 'forgás' : 'spin'}: ${m.spin} °/s, ${m.mode === 'axis' ? 'axis' : 'plane'}, pivot ${JSON.stringify(m.pivot || markCenter(m).map(r1))}`);

/* ───────────── toast ───────────── */
let toastTimer = null;
function toast(msg, action) {
  const el = $('#toast'); el.innerHTML = '';
  const s = document.createElement('span'); s.textContent = msg; el.appendChild(s);
  if (action) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = action.label;
    b.addEventListener('click', () => { el.hidden = true; action.fn(); }); el.appendChild(b);
  }
  el.hidden = false; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, action ? 7000 : 3500);
}

/* ───────────── code editor ───────────── */
function updateGutter() {
  const n = $('#code').value.split('\n').length;
  const gt = $('#gutter');
  if (gt._n !== n) { gt._n = n; let s = ''; for (let i = 1; i <= n; i++) s += i + '\n'; gt.textContent = s; }
  gt.scrollTop = $('#code').scrollTop;
}
function updateCodeState() {
  const el = $('#codeState'), dirty = $('#code').value !== lastRunScript;
  el.textContent = dirty ? T('codeDirty') : T('codeClean');
  el.classList.toggle('dirty', dirty);
}
function runCode() { scene.script = $('#code').value; seenMarks.clear(); cmSig = ''; runScene(); setPlaying(true); scheduleAutosave(); }

const guideCode = code => code.replace(/⟨([^|⟩]*)\|([^⟩]*)⟩/g, (m, hu, en) => (LANG === 'hu' ? hu : en));

function renderHelp() {
  const L = LANG === 'hu';
  let html = `<nav class="help-nav"><button type="button" class="link-btn" data-jump="guide">${L ? 'Útmutató' : 'Guide'}</button> · <button type="button" class="link-btn" data-jump="ref">${L ? 'Parancsok' : 'Command reference'}</button></nav>`;
  html += `<h3 id="help-guide">${L ? 'Útmutató 7 lépésben' : 'Guide in 7 steps'}</h3>`;
  html += `<p class="muted">${L ? 'Minden lépés egy kis, működő példa. A „Kipróbálom” betölti a Kód fülre – ott írd át, és futtasd újra.' : 'Each step is a small working example. “Try it” loads it into the Code tab – change it there and run it again.'}</p>`;
  GUIDE.forEach((s, i) => {
    html += `<section class="lesson"><h4><span class="num">${i + 1}</span>${esc(s.t[LANG])}</h4><p>${esc(s.d[LANG])}</p><pre>${esc(guideCode(s.code))}</pre><div class="lesson-btns"><button type="button" class="btn primary" data-try="${i}">${L ? 'Kipróbálom' : 'Try it'}</button><button type="button" class="btn" data-copyex="${i}">${L ? 'Másolás' : 'Copy'}</button></div></section>`;
  });
  html += `<h4>${L ? 'Ha valami nem megy' : 'When something goes wrong'}</h4><ul class="tips">${GUIDE_TIPS[LANG].map(x => `<li>${x}</li>`).join('')}</ul>`;
  html += `<h3 id="help-ref">${L ? 'Parancsok' : 'Command reference'}</h3>`;
  html += HELP.intro[LANG];
  for (const sec of HELP.sections) {
    html += `<h4>${esc(sec.t[LANG])}</h4><dl>`;
    for (const [sig, hu, en] of sec.items) html += `<dt><code>${esc(sig)}</code></dt><dd>${esc(LANG === 'hu' ? hu : en)}</dd>`;
    html += '</dl>';
  }
  html += HELP.keys[LANG];
  $('#help').innerHTML = html;
}

function buildPresetSelect() {
  const s = $('#presetSel');
  s.innerHTML = `<option value="">${esc(T('presets'))}</option>` + PRESETS.map(p => `<option value="${p.id}">${esc(tr(p.name))}</option>`).join('');
  s.value = '';
}
function applyLang() {
  document.documentElement.lang = LANG;
  $$('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
  $$('[data-i18n-title]').forEach(el => { el.title = T(el.dataset.i18nTitle); el.setAttribute('aria-label', el.title); });
  $$('[data-i18n-ph]').forEach(el => { el.placeholder = T(el.dataset.i18nPh); });
  $$('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
  buildPresetSelect();
  if (R) { buildControls(true); R.readouts.clear(); renderReadouts(true); if (R.error) showError(R.error); }
  renderHelp(); renderAssets(); renderMarkList(); updateToolHint(); updateRecUI(); setPlaying(playing); setSpeed(speed); updateCodeState();
}

/* ───────────── resizable side panel (wider by default on the Code tab) ───────────── */
let curTab = 'controls';
const wideTab = tab => tab === 'code' || tab === 'help';   // code and help examples get the wide panel
const sideKey = tab => wideTab(tab) ? 'sideWCode' : 'sideW';
function defaultSide(tab) { return wideTab(tab) ? Math.round(clamp(window.innerWidth * 0.46, 560, 860)) : 400; }
function applySideWidth(w) {
  const max = Math.max(320, window.innerWidth * 0.72);
  w = Math.round(clamp(w, 300, max));
  document.documentElement.style.setProperty('--side-w', w + 'px');
  layoutStage();
  return w;
}
function sideWidthFor(tab) { const v = +store.get(sideKey(tab)); return v > 0 ? v : defaultSide(tab); }
(function () {
  const sp = $('#splitter');
  let dragging = false;
  sp.addEventListener('pointerdown', e => { dragging = true; sp.classList.add('drag'); document.body.classList.add('resizing'); try { sp.setPointerCapture(e.pointerId); } catch (err) { /* old browser */ } e.preventDefault(); });
  sp.addEventListener('pointermove', e => {
    if (!dragging) return;
    const pad = parseFloat(getComputedStyle($('.layout')).paddingRight) || 12;
    applySideWidth(window.innerWidth - e.clientX - pad - 6);
  });
  const end = () => {
    if (!dragging) return; dragging = false; sp.classList.remove('drag'); document.body.classList.remove('resizing');
    store.set(sideKey(curTab), String(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--side-w'))));
  };
  sp.addEventListener('pointerup', end); sp.addEventListener('pointercancel', end);
  sp.addEventListener('dblclick', () => { try { localStorage.removeItem('animlab.' + sideKey(curTab)); } catch (e) { /* no storage */ } applySideWidth(defaultSide(curTab)); });
  sp.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault(); e.stopPropagation();
    const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--side-w')) || 400;
    store.set(sideKey(curTab), String(applySideWidth(cur + (e.key === 'ArrowLeft' ? 30 : -30))));
  });
})();

/* ───────────── wiring ───────────── */
function selectTab(name) {
  $$('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  $$('.tab-panel').forEach(p => { p.hidden = p.id !== 'tab-' + name; });
  store.set('tab', name);
  if (curTab !== name || !document.documentElement.style.getPropertyValue('--side-w')) { curTab = name; applySideWidth(sideWidthFor(name)); }
  if (name === 'code') updateGutter();
  if (name === 'marks') { renderCodeMarks(true); renderBound(true); }
  if (name !== 'marks' && markTool) setTool(markTool);
}
$$('.tabs button').forEach(b => b.addEventListener('click', () => selectTab(b.dataset.tab)));
$$('.lang button').forEach(b => b.addEventListener('click', () => { LANG = b.dataset.lang; store.set('lang', LANG); applyLang(); }));

$('#btPlay').addEventListener('click', () => setPlaying(!playing));
$('#btStep').addEventListener('click', () => { setPlaying(false); stepReq = true; });
$('#btReset').addEventListener('click', () => { needsRerun = true; });
$('#btFull').addEventListener('click', async () => {
  try { if (document.fullscreenElement) await document.exitFullscreen(); else await $('#stageCol').requestFullscreen(); } catch (e) { /* refused */ }
});
document.addEventListener('fullscreenchange', () => setTimeout(layoutStage, 50));
$('#speed').addEventListener('input', e => { setSpeed(Math.pow(2, +e.target.value)); scheduleAutosave(); });
$('#speed').addEventListener('dblclick', () => setSpeed(1));

$('#presetSel').addEventListener('change', e => {
  const id = e.target.value; if (!id) return;
  loadScene(presetScene(id), {undo: true});
  e.target.value = '';
});
$('#btnNew').addEventListener('click', () => loadScene({name: T('newScene'), script: BLANK}, {undo: true}));
$('#btnOpen').addEventListener('click', () => $('#fileOpen').click());
$('#fileOpen').addEventListener('change', e => { const f = e.target.files[0]; if (f) openFile(f); e.target.value = ''; });
$('#btnSave').addEventListener('click', () => {
  scene.script = $('#code').value;
  saveFile(fileBase() + '.animlab.json', JSON.stringify(sceneData(), null, 1), 'application/json');
});
const menu = $('#exportMenu'), menuBtn = $('#btnExport');
function closeMenu() { menu.hidden = true; menuBtn.setAttribute('aria-expanded', 'false'); }
menuBtn.addEventListener('click', e => { e.stopPropagation(); menu.hidden = !menu.hidden; menuBtn.setAttribute('aria-expanded', String(!menu.hidden)); });
document.addEventListener('click', e => { if (!menu.hidden && !menu.contains(e.target)) closeMenu(); });
$('#exVideo').addEventListener('click', () => { closeMenu(); toggleRecord(); });
recBadge.addEventListener('click', () => { if (rec) rec.stop(); });
$('#exPng').addEventListener('click', () => {
  closeMenu();
  stageCv.toBlob(b => { if (b) saveFile(fileBase() + '.png', b, 'image/png'); }, 'image/png');
});
$('#exHtml').addEventListener('click', () => {
  closeMenu();
  scene.script = $('#code').value;
  saveFile(fileBase() + '.html', buildStandalone(), 'text/html');
});
$('#sceneName').addEventListener('input', e => { scene.name = e.target.value; scheduleAutosave(); });
$('#imgIn').addEventListener('change', async e => { for (const f of e.target.files) await addImageFile(f); e.target.value = ''; });
$('#stageErr').addEventListener('click', () => { selectTab('code'); gotoLine(+$('#codeErr').dataset.line); });
$('#codeErr').addEventListener('click', () => gotoLine(+$('#codeErr').dataset.line));
$('#btRun').addEventListener('click', runCode);
$('#help').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.jump) { const t = $('#help-' + b.dataset.jump); if (t) t.scrollIntoView({block: 'start'}); return; }
  const i = b.dataset.try ?? b.dataset.copyex;
  if (i == null) return;
  const s = GUIDE[+i], codeText = guideCode(s.code) + '\n';
  if (b.dataset.try != null) {
    loadScene({name: (LANG === 'hu' ? 'Útmutató ' : 'Guide ') + (+i + 1) + ' – ' + s.t[LANG], script: codeText}, {undo: true});
    selectTab('code');
  } else {
    try { await navigator.clipboard.writeText(codeText); toast(T('copied') + ' ' + s.t[LANG]); }
    catch (err) { const pre = b.closest('.lesson').querySelector('pre'); const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
  }
});

const code = $('#code');
code.addEventListener('input', () => { scene.script = code.value; updateGutter(); updateCodeState(); scheduleAutosave(); });
code.addEventListener('scroll', () => { $('#gutter').scrollTop = code.scrollTop; });
code.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runCode(); return; }
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = code.selectionStart, en = code.selectionEnd;
    code.setRangeText('  ', s, en, 'end'); code.dispatchEvent(new Event('input'));
  } else if (e.key === 'Enter' && !e.shiftKey) {
    const s = code.selectionStart, before = code.value.slice(0, s);
    const lineStart = before.lastIndexOf('\n') + 1;
    let indent = (before.slice(lineStart).match(/^\s*/) || [''])[0];
    if (/[{([]\s*$/.test(before)) indent += '  ';
    e.preventDefault();
    code.setRangeText('\n' + indent, s, code.selectionEnd, 'end'); code.dispatchEvent(new Event('input'));
  }
});

document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && e.target.type !== 'range' && e.target.type !== 'checkbox';
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); $('#btnSave').click(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') { e.preventDefault(); $('#btnOpen').click(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === 'r' || e.key === 'R') needsRerun = true;
  else if (e.key === 'ArrowRight' && e.target.type !== 'range') { setPlaying(false); stepReq = true; }
  else if (e.key === 'Escape') { closeMenu(); if (pathDraft) pathDraft = null; if (pivotFor) { pivotFor = null; updateToolHint(); } }
  else if (e.key === 'Enter' && pathDraft) finishPath();
});

window.addEventListener('dragover', e => { e.preventDefault(); });
window.addEventListener('drop', async e => {
  e.preventDefault();
  for (const f of e.dataTransfer.files) {
    if (/json$/i.test(f.name) || f.type === 'application/json') await openFile(f);
    else if (/^image\//.test(f.type)) { await addImageFile(f); selectTab('assets'); }
  }
});
window.addEventListener('resize', () => { if (window.innerWidth > 900) applySideWidth(sideWidthFor(curTab)); layoutStage(); readTokens(); });
if (window.ResizeObserver) new ResizeObserver(() => layoutStage()).observe($('#stageWrap'));
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTokens); } catch (e) { /* old browser */ }
new MutationObserver(readTokens).observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme']});

/* ───────────── boot ───────────── */
readTokens();
R = freshRuntime();
let initial = null;
const emb = $('#embedded-scene').textContent.trim();
if (emb) { try { initial = JSON.parse(emb); } catch (e) { initial = null; } }
if (!initial) { const a = store.get('autosave'); if (a) { try { const o = JSON.parse(a); if (o && o.format === 'animlab-scene' && o.script) initial = o; } catch (e) { initial = null; } } }
if (!initial) initial = presetScene('motor');
applyLang();
loadScene(initial);
selectTab(store.get('tab') || 'controls');
requestAnimationFrame(t => { lastNow = t; loop(t); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { ctlSig = null; buildControls(); });
})();
</script>
</body>
