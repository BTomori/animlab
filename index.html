<script type="text/plain" id="preset-generator" data-app>// Generátor – forgó tekercs homogén mágneses térben
// Generator – a coil turning in a uniform magnetic field
//   u = N·B·A·ω·cos θ        kommutátorral / with commutator: |u|

// Vászon: szélesség, magasság (px), háttérszín / Canvas: width, height (px), background colour
stage(1000, 600, "#fbfbf8");
// Felirat a vászon bal felső sarkában / Caption in the top-left corner
title({hu: "Generátor", en: "Generator"});
// Kezdő lassítás (a Sebesség csúszkán állítható) / Initial slow motion (change it on the Speed slider)
timeScale(0.025);
// A grafikon időablaka másodpercben / Chart time window in seconds
plotWindow(3);

// Csúszkák: azonosító, felirat (HU/EN), min, max, alapérték, lépés, egység – értékük: P.azonosító / Sliders: id, label (HU/EN), min, max, default, step, unit – value: P.id
param("n",  {hu: "Fordulatszám n", en: "Speed n"}, 0, 600, 120, 1, "1/min");
param("N",  {hu: "Menetszám N", en: "Number of turns N"}, 1, 300, 100, 1, "");
param("B",  {hu: "Mágneses indukció B", en: "Flux density B"}, 0, 1.5, 0.8, 0.01, "T");
param("A",  {hu: "Tekercs felülete A", en: "Coil area A"}, 5, 100, 40, 1, "cm²");
param("RL", {hu: "Terhelés (izzó) R", en: "Load (lamp) R"}, 1, 100, 10, 1, "Ω");
// Kapcsolók: értékük true / false / Switches: their value is true / false
toggle("comm",  {hu: "Kommutátor (egyenirányítás)", en: "Commutator (rectified)"}, false);
toggle("field", {hu: "Erővonalak", en: "Field lines"}, true);

let theta = 0, u = 0, i = 0;

// Fizika: sok kis lépésben fut, dt a lépés hossza (s) / Physics: runs in many small steps, dt is the step length (s)
update(dt => {
  const w = P.n * PI / 30;
  theta += w * dt;
  const k = P.N * P.B * P.A * 1e-4;
  // Indukált feszültség: u = N·B·A·ω·cos θ / induced voltage
  const ui = k * w * cos(theta);   // a tekercsben indukált / induced in the coil
  u = P.comm ? abs(ui) : ui;
  // Ohm törvénye a terhelésen / Ohm’s law on the load
  i = u / P.RL;
});

const cx = 360, cy = 320, r = 120;

// Rajzolás minden képkockán (szünetben is) / Drawing on every frame (also while paused)
draw(t => {
  rect(62, 100, 596, 440, {stroke: "#9aa3b1", lw: 16, radius: 28});
  rect(70, 170, 120, 300, {fill: C.N, radius: 4});
  rect(530, 170, 120, 300, {fill: C.S, radius: 4});
  text("N", 130, 320, {size: 46, bold: true, color: "#fff", align: "center", baseline: "middle"});
  text("S", 590, 320, {size: 46, bold: true, color: "#fff", align: "center", baseline: "middle"});
  if (P.field && P.B > 0.001) {
    const n = round(3 + P.B / 1.5 * 9);
    for (let j = 0; j < n; j++) {
      const y = 182 + (j + 0.5) * 276 / n;
      line(190, y, 530, y, {stroke: "#8b95a5", lw: 1.2, alpha: 0.6});
      arrow(196, y, 228, y, {stroke: "#8b95a5", lw: 1.2, head: 7, id: "erővonal-nyíl"});
      arrow(492, y, 524, y, {stroke: "#8b95a5", lw: 1.2, head: 7, id: "erővonal-nyíl"});
    }
  }

  circle(cx, cy, r, {fill: "rgba(255,255,255,0.55)", stroke: "#c3cad5", lw: 2, dash: [6, 6]});
  const ax = cx + r * cos(theta), ay = cy - r * sin(theta);
  const bx = cx - r * cos(theta), by = cy + r * sin(theta);
  line(ax, ay, bx, by, {stroke: C.copper, lw: 6, alpha: 0.85});
  circle(cx, cy, 11, {fill: C.ink});

  // A vezetők sebessége és az indukált áram iránya (v × B)
  // Conductor velocity and induced current direction (v × B)
  const turning = P.n > 0 ? 1 : 0;
  if (turning) {
    vector(ax, ay, -sin(theta) * 48, -cos(theta) * 48, {stroke: C.green, lw: 2.5}, "v");
    vector(bx, by, sin(theta) * 48, cos(theta) * 48, {stroke: C.green, lw: 2.5}, "v");
  }
  // Áramirány a vezetőkben: ⊙ kifelé, ⊗ befelé / current direction: ⊙ out, ⊗ in
  const dA = -sign(cos(theta)) * turning;
  current(ax, ay, dA, 17, {stroke: C.orange, lw: 3});
  current(bx, by, -dA, 17, {stroke: C.teal, lw: 3});

  // Izzó / lamp
  const lx = 830, ly = 190;
  const pw = u * i;
  // Az izzó fényereje a teljesítménnyel nő / lamp brightness grows with power
  const glow = clamp(pw / 3, 0, 1);
  if (glow > 0.01) circle(lx, ly, 46 + 50 * glow, {fill: C.yellow, alpha: 0.3 * glow, stroke: false});
  circle(lx, ly, 42, {fill: glow > 0.01 ? "rgba(255, 205, 60, " + (0.25 + 0.75 * glow) + ")" : "#ffffff", stroke: C.ink, lw: 2});
  polyline([[lx - 14, ly + 40], [lx - 10, ly + 2], [lx - 5, ly - 8], [lx, ly + 2], [lx + 5, ly - 8], [lx + 10, ly + 2], [lx + 14, ly + 40]], {stroke: "#6b4a10", lw: 1.6});
  rect(lx - 20, ly + 38, 40, 28, {fill: "#9aa3b1", radius: 3});

  // Gyűjtő: csúszógyűrűk vagy kommutátor / collector: slip rings or commutator
  const kx = 830, ky = 440, kr = 40;
  polyline([[lx - 10, ly + 66], [lx - 10, 330], [kx - 90, 330], [kx - 90, ky], [kx - kr - 30, ky]], {stroke: C.ink, lw: 2});
  polyline([[lx + 10, ly + 66], [lx + 10, 330], [kx + 90, 330], [kx + 90, ky], [kx + kr + 30, ky]], {stroke: C.ink, lw: 2});
  rect(kx - kr - 30, ky - 12, 22, 24, {fill: "#5b6472", radius: 3});
  rect(kx + kr + 8, ky - 12, 22, 24, {fill: "#5b6472", radius: 3});
  if (P.comm) {
    arc(kx, ky, kr, -theta - PI / 2 + 0.2, -theta + PI / 2 - 0.2, {stroke: C.orange, lw: 14});
    arc(kx, ky, kr, -theta + PI / 2 + 0.2, -theta + 3 * PI / 2 - 0.2, {stroke: C.teal, lw: 14});
  } else {
    circle(kx, ky, kr, {stroke: C.copper, lw: 14});
    circle(kx + kr * cos(-theta), ky + kr * sin(-theta), 4, {fill: "#fff"});
  }
  circle(kx, ky, 8, {fill: C.ink});
  text(P.comm ? {hu: "kommutátor → lüktető egyenfeszültség", en: "commutator → pulsating DC"}
              : {hu: "csúszógyűrű → váltakozó feszültség", en: "slip ring → alternating voltage"},
       kx, ky + kr + 40, {size: 14, color: C.gray, align: "center"});

  const w = P.n * PI / 30, k = P.N * P.B * P.A * 1e-4, Umax = k * w;
  // Mért értékek a Vezérlők fülön / Readouts on the Controls tab
  show({hu: "Pillanatnyi feszültség u", en: "Instantaneous voltage u"}, u, "V");
  show({hu: "Áram i", en: "Current i"}, i, "A");
  show({hu: "Csúcsfeszültség Û = N·B·A·ω", en: "Peak voltage Û = N·B·A·ω"}, Umax, "V");
  if (P.comm) show({hu: "Középérték 2Û/π", en: "Average value 2Û/π"}, 2 * Umax / PI, "V");
  else show({hu: "Effektív érték Û/√2", en: "RMS value Û/√2"}, Umax / sqrt(2), "V");
  show({hu: "Frekvencia f = n/60", en: "Frequency f = n/60"}, P.n / 60, "Hz");
  show({hu: "Pillanatnyi teljesítmény", en: "Instantaneous power"}, pw, "W");

  // Élő grafikonok a vászon alatt / Live charts under the canvas
  plot({hu: "Feszültség u", en: "Voltage u"}, u, {unit: "V", color: C.blue});
  plot({hu: "Áram i", en: "Current i"}, i, {unit: "A", color: C.orange});
});
</script>

<script type="text/plain" id="preset-threephase" data-app>// Háromfázisú rendszer – csillag (Y) vagy delta (Δ) terhelés
// Three-phase system – star (Y) or delta (Δ) load
//   u_k = √2·U_f·sin(ωt − k·120°)      U_v = √3·U_f      Ī = Ū / Z,   Z = R + jX
//   Y: Ī_N = Ī₁ + Ī₂ + Ī₃           Δ: Ī₁ = Ī₁₂ − Ī₃₁ (vonali áram / line current)

// Vászon: szélesség, magasság (px), háttérszín / Canvas: width, height (px), background colour
stage(1000, 600, "#fbfbf8");
// Felirat a vászon bal felső sarkában / Caption in the top-left corner
title({hu: "Háromfázisú rendszer", en: "Three-phase system"});
timeScale(0.002);   // 50 Hz → 0,1 Hz a képernyőn (10 s / periódus) / 50 Hz shown at 0.1 Hz (10 s per cycle)
plotWindow(0.06);   // 3 periódus 50 Hz-en / 3 periods at 50 Hz

// Csúszkák: azonosító, felirat (HU/EN), min, max, alapérték, lépés, egység – értékük: P.azonosító / Sliders: id, label (HU/EN), min, max, default, step, unit – value: P.id
param("U",  {hu: "Vonali feszültség U_v", en: "Line voltage U_L"}, 100, 690, 400, 1, "V");
param("f",  {hu: "Frekvencia f", en: "Frequency f"}, 10, 100, 50, 1, "Hz");
param("R1", {hu: "Ellenállás R₁", en: "Resistance R₁"}, 1, 200, 40, 1, "Ω");
param("R2", {hu: "Ellenállás R₂", en: "Resistance R₂"}, 1, 200, 40, 1, "Ω");
param("R3", {hu: "Ellenállás R₃", en: "Resistance R₃"}, 1, 200, 40, 1, "Ω");
param("X",  {hu: "Reaktancia X (50 Hz-en; + induktív, − kapacitív)", en: "Reactance X (at 50 Hz; + inductive, − capacitive)"}, -100, 100, 30, 1, "Ω");
// Legördülő lista: [érték, felirat] párok / Drop-down list: [value, label] pairs
choice("conn", {hu: "Kapcsolás", en: "Connection"},
  [["Y", {hu: "Csillag, nullavezetővel", en: "Star, with neutral"}], ["D", {hu: "Delta (háromszög)", en: "Delta"}]], "Y");
// Kapcsolók: értékük true / false / Switches: their value is true / false
toggle("rot",  {hu: "Forgó fázorok", en: "Rotating phasors"}, true);
toggle("line", {hu: "Vonali feszültségek", en: "Line voltages"}, false);
// Ezek változásakor a jelenet újraindul / The scene restarts when these change
resetOn("conn");

const PH = [C.L1, C.L2, C.L3];   // IEC: barna, fekete, szürke / brown, black, grey
const IX = ["₁", "₂", "₃"];

function solve() {
  const Xf = P.X >= 0 ? P.X * P.f / 50 : P.X * 50 / P.f;         // X_L ∝ f,  X_C ∝ 1/f
  const Z = [complex(P.R1, Xf), complex(P.R2, Xf), complex(P.R3, Xf)];
  const Uf = P.U / sqrt(3);
  const Up = [0, 1, 2].map(k => cpolar(Uf, -k * deg(120)));        // fázisfeszültségek / phase voltages
  const Ul = [0, 1, 2].map(k => Up[k].sub(Up[(k + 1) % 3]));       // Ū₁₂, Ū₂₃, Ū₃₁
  let Ub, Ib, IL, IN = complex(0, 0);   // Ub, Ib: a fogyasztón / across the load;  IL: vonali áram / line current
  if (P.conn === "Y") {
    Ub = Up; Ib = Up.map((u, k) => u.div(Z[k])); IL = Ib;
    IN = IL[0].add(IL[1]).add(IL[2]);
  } else {
    Ub = Ul; Ib = Ul.map((u, k) => u.div(Z[k]));
    IL = [0, 1, 2].map(k => Ib[k].sub(Ib[(k + 2) % 3]));
  }
  let S = complex(0, 0);                                                 // S = P + jQ
  for (let k = 0; k < 3; k++) S = S.add(Ub[k].mul(Ib[k].conj()));
  return {Uf, Up, Ul, Ub, Ib, IL, IN, S, Z};
}
const inst = (z, th) => sqrt(2) * z.abs() * sin(th + z.arg());     // pillanatérték / instantaneous value

let th = 0;   // ωt, folytonos frekvenciaváltáskor is / stays continuous when f changes
// Fizika: sok kis lépésben fut, dt a lépés hossza (s) / Physics: runs in many small steps, dt is the step length (s)
update(dt => { th += 2 * PI * P.f * dt; });

// Rajzolás minden képkockán (szünetben is) / Drawing on every frame (also while paused)
draw(t => {
  const s = solve();
  const rot = P.rot ? th : 0;

  // ── Fázorábra / phasor diagram ──
  const ox = 250, oy = 335;
  line(ox - 215, oy, ox + 215, oy, {stroke: C.light, lw: 1});
  line(ox, oy - 215, ox, oy + 215, {stroke: C.light, lw: 1});
  // Lépték: feszültség px/V, áram külön px/A / scale: voltage px per V, current its own px per A
  const ku = 185 / (P.line ? P.U : s.Uf);
  const Imax = max(...s.IL.map(z => z.abs()), s.IN.abs(), 1e-9);
  const ki = 125 / Imax;   // az áram külön léptékű / currents use their own scale
  for (let k = 0; k < 3; k++) {
    if (P.line) {
      const a = s.Up[(k + 1) % 3], z = s.Ul[k];
      const sx = ox + a.abs() * ku * cos(a.arg() + rot), sy = oy - a.abs() * ku * sin(a.arg() + rot);
      phasor(sx, sy, z.abs() * ku, z.arg() + rot, {stroke: C.purple, lw: 1.8}, "U" + IX[k] + IX[(k + 1) % 3]);
    }
    phasor(ox, oy, s.Up[k].abs() * ku, s.Up[k].arg() + rot, {stroke: PH[k], lw: 3}, "U" + IX[k]);
    phasor(ox, oy, s.IL[k].abs() * ki, s.IL[k].arg() + rot, {stroke: PH[k], lw: 2, dash: [7, 4]}, "I" + IX[k]);
  }
  if (P.conn === "Y" && s.IN.abs() > Imax * 0.02) phasor(ox, oy, s.IN.abs() * ki, s.IN.arg() + rot, {stroke: C.blue, lw: 2.5}, "Iɴ");
  circle(ox, oy, 4, {fill: C.ink});
  text({hu: "— feszültség    - - áram (saját lépték)", en: "— voltage    - - current (own scale)"}, 40, 580, {size: 12, color: C.gray});

  // ── Kapcsolási rajz / circuit ──
  const yL = [150, 195, 240], yN = 285, x0 = 545;
  // Pillanatnyi vonali áramok a nyilakhoz / instantaneous line currents for the arrows
  const iL = s.IL.map(z => inst(z, th)), iN = inst(s.IN, th), ipk = sqrt(2) * Imax;
  for (let k = 0; k < 3; k++) text("L" + (k + 1), x0 - 8, yL[k] + 5, {size: 14, bold: true, color: PH[k], align: "right"});
  if (P.conn === "Y") {
    const xs = [700, 800, 900];
    for (let k = 0; k < 3; k++) {
      polyline([[x0, yL[k]], [xs[k], yL[k]], [xs[k], 330]], {stroke: PH[k], lw: 2.5});
      box(xs[k], 370, 34, 80, 0, {fill: "#ffffff", stroke: PH[k], lw: 2});
      text("Z" + IX[k], xs[k] + 24, 376, {size: 14});
      polyline([[xs[k], 410], [xs[k], 460], [800, 460]], {stroke: PH[k], lw: 2});
    }
    text("N", x0 - 8, yN + 5, {size: 14, bold: true, color: C.blue, align: "right"});
    polyline([[x0, yN], [610, yN], [610, 520], [800, 520], [800, 460]], {stroke: C.blue, lw: 2});
    circle(800, 460, 5, {fill: C.ink});
    const LN = 50 * iN / ipk;
    if (abs(LN) > 4) arrow(575 + LN / 2, yN - 11, 575 - LN / 2, yN - 11, {stroke: C.blue, lw: 2.5, id: "nullavezető áram (nyíl)"});
  } else {
    const A = [800, 335], B = [655, 505], Cc = [945, 505];
    polyline([[x0, yL[0]], [800, yL[0]], A], {stroke: PH[0], lw: 2.5});
    polyline([[x0, yL[1]], [655, yL[1]], B], {stroke: PH[1], lw: 2.5});
    polyline([[x0, yL[2]], [945, yL[2]], Cc], {stroke: PH[2], lw: 2.5});
    const edges = [[A, B], [B, Cc], [Cc, A]];   // Z₁: L1–L2,  Z₂: L2–L3,  Z₃: L3–L1
    edges.forEach(([p1, p2], k) => {
      line(p1[0], p1[1], p2[0], p2[1], {stroke: C.ink, lw: 2});
      const mx = (p1[0] + p2[0]) / 2, my = (p1[1] + p2[1]) / 2, a = atan2(p2[1] - p1[1], p2[0] - p1[0]);
      box(mx, my, 60, 26, a, {fill: "#ffffff", stroke: C.ink, lw: 2});
      const nx = mx - 800, ny = my - 448, nl = hypot(nx, ny);
      text("Z" + IX[k], mx + nx / nl * 34, my + ny / nl * 34 + 5, {size: 14, align: "center"});
    });
    for (const q of [A, B, Cc]) circle(q[0], q[1], 5, {fill: C.ink});
  }
  for (let k = 0; k < 3; k++) {              // vonali áramok pillanatnyi iránya / instantaneous line currents
    const Lk = 50 * iL[k] / ipk;
    if (abs(Lk) > 4) arrow(610 - Lk / 2, yL[k] - 11, 610 + Lk / 2, yL[k] - 11, {stroke: C.red, lw: 2.5, id: "vonali áram (nyíl)"});
  }
  text({hu: "piros nyíl: pillanatnyi áramirány", en: "red arrows: instantaneous current"}, x0, 110, {size: 12, color: C.gray});

  // ── Mért értékek / readouts ──
  show({hu: "Fázisfeszültség U_f = U_v/√3", en: "Phase voltage U_ph = U_L/√3"}, s.Uf, "V");
  for (let k = 0; k < 3; k++) show({hu: "Vonali áram I" + IX[k], en: "Line current I" + IX[k]}, s.IL[k].abs(), "A");
  if (P.conn === "Y") show({hu: "Nullavezető árama Iɴ", en: "Neutral current Iɴ"}, s.IN.abs(), "A");
  else show({hu: "Fázisáram I₁₂ (a fogyasztón)", en: "Phase current I₁₂ (in the load)"}, s.Ib[0].abs(), "A");
  show({hu: "Fáziseltolás φ = arc tg X/R₁", en: "Phase angle φ = atan X/R₁"}, todeg(s.Z[0].arg()), "°");
  show({hu: "Hatásos teljesítmény P", en: "Active power P"}, s.S.re, "W");
  show({hu: "Meddő teljesítmény Q", en: "Reactive power Q"}, s.S.im, "var");
  show({hu: "Látszólagos teljesítmény S", en: "Apparent power S"}, s.S.abs(), "VA");
  show({hu: "Teljesítménytényező cos φ", en: "Power factor cos φ"}, s.S.re / max(s.S.abs(), 1e-9), "");

  for (let k = 0; k < 3; k++) plot("u" + IX[k], inst(s.Up[k], th), {unit: "V", color: PH[k], group: "u"});
  for (let k = 0; k < 3; k++) plot("i" + IX[k], iL[k], {unit: "A", color: PH[k], group: "i"});
  if (P.conn === "Y") plot("iɴ", iN, {unit: "A", color: C.blue, group: "i"});
});
</script>

<script type="text/plain" id="preset-rotfield" data-app>// Forgó mágneses mező – három, 120°-onként elhelyezett tekercs
// Rotating magnetic field – three coils placed 120° apart
//   i_k = Î·sin(ωt − k·120°)      B = B₁ + B₂ + B₃,  |B| = 1,5·B̂      n_s = 60·f / p

// Vászon: szélesség, magasság (px), háttérszín / Canvas: width, height (px), background colour
stage(1000, 600, "#fbfbf8");
// Felirat a vászon bal felső sarkában / Caption in the top-left corner
title({hu: "Forgó mágneses mező", en: "Rotating magnetic field"});
// Kezdő lassítás (a Sebesség csúszkán állítható) / Initial slow motion (change it on the Speed slider)
timeScale(0.002);
// A grafikon időablaka másodpercben / Chart time window in seconds
plotWindow(0.06);

// Csúszkák: azonosító, felirat (HU/EN), min, max, alapérték, lépés, egység – értékük: P.azonosító / Sliders: id, label (HU/EN), min, max, default, step, unit – value: P.id
param("f",  {hu: "Frekvencia f", en: "Frequency f"}, 1, 100, 50, 1, "Hz");
param("Im", {hu: "Áram csúcsértéke Î", en: "Peak current Î"}, 0, 20, 10, 0.1, "A");
param("p",  {hu: "Póluspárok száma p", en: "Pole pairs p"}, 1, 3, 1, 1, "");
// Kapcsolók: értékük true / false / Switches: their value is true / false
toggle("rev",   {hu: "Fázissorrend-csere (L2 ↔ L3)", en: "Swap phase order (L2 ↔ L3)"}, false);
toggle("loss",  {hu: "L3 fázis kiesése (egyfázisú üzem)", en: "Loss of phase L3 (single-phasing)"}, false);
toggle("parts", {hu: "Fázisonkénti mezővektorok (p = 1)", en: "Field vector of each phase (p = 1)"}, true);
toggle("trace", {hu: "A vektor végpontjának pályája", en: "Path of the vector tip"}, true);

const PH = [C.L1, C.L2, C.L3];
const sx = 320, sy = 320;   // állórész középpontja / stator centre
let th = 0;
const path = [];

// Fizika: sok kis lépésben fut, dt a lépés hossza (s) / Physics: runs in many small steps, dt is the step length (s)
update(dt => { th += 2 * PI * P.f * dt; });

// Fázisáramok csúcsértéke és fázisa / peak and phase of each current
function currentPhasors() {
  if (P.loss) {   // L3 nélkül az 1. és 2. tekercs sorba kerül az U₁₂-re / coils 1 and 2 end up in series on U₁₂
    const a = P.Im * sqrt(3) / 2;
    return [[a, deg(30)], [a, deg(210)], [0, 0]];
  }
  return [[P.Im, 0], [P.Im, -deg(120)], [P.Im, -deg(240)]];
}

// Rajzolás minden képkockán (szünetben is) / Drawing on every frame (also while paused)
draw(t => {
  const ph = currentPhasors();
  // A három áram pillanatértéke / instantaneous value of the three currents
  const i = ph.map(([a, phi]) => a * sin(th + phi));
  const axes = P.rev ? [0, deg(240), deg(120)] : [0, deg(120), deg(240)];   // tekercstengelyek / coil axes

  // Háromfázisú állórész; a vezetőkben ⊙/⊗ az áram iránya / Three-phase stator; ⊙/⊗ shows the current direction
  stator3(sx, sy, {p: P.p, i: i, imax: max(P.Im, 1e-9), axes: axes});
  circle(sx, sy, 160, {fill: "#ffffff", stroke: "#c3cad5", lw: 1.5, dash: [5, 5]});

  // Eredő mező = a három tekercs mezőjének vektori összege / resultant field = vector sum of the three coil fields
  const B = fieldVec(i, axes);           // villamos szög / electrical angle
  const k = 100 / max(P.Im, 1e-9);       // Î → 100 px, így 1,5·Î → 150 px
  if (P.parts && P.p === 1) {
    for (let j = 0; j < 3; j++) phasor(sx, sy, i[j] * k, axes[j], {stroke: PH[j], lw: 2}, "B" + "₁₂₃"[j]);
  }
  for (let m = 0; m < P.p; m++) {        // p póluspár: p mezőtengely / p pole pairs: p field axes
    phasor(sx, sy, B.mag * k, (B.angle + 2 * PI * m) / P.p, {stroke: C.red, lw: 4}, m === 0 ? "B" : "");
  }
  if (P.trace && B.mag > 1e-6) {
    const a = B.angle / P.p, tip = [sx + B.mag * k * cos(a), sy - B.mag * k * sin(a)];
    const lastPt = path[path.length - 1];
    if (!lastPt || hypot(tip[0] - lastPt[0], tip[1] - lastPt[1]) > 4) path.push(tip);   // térben mintavételezve / sampled in space
    if (path.length > 260) path.shift();
    polyline(path.concat([tip]), {stroke: C.red, lw: 1.5, alpha: 0.35});
  }
  circle(sx, sy, 5, {fill: C.ink});

  // Áramfázorok: a függőleges vetület a pillanatérték / current phasors: vertical projection = instantaneous value
  const px = 790, py = 215, R0 = 100;
  circle(px, py, R0, {stroke: C.light, lw: 1});
  line(px - 120, py, px + 120, py, {stroke: C.light, lw: 1});
  line(px, py - 120, px, py + 120, {stroke: C.light, lw: 1});
  ph.forEach(([a, phi], j) => {
    if (a < 1e-9) return;
    const L = a / max(P.Im, 1e-9) * R0, ang = th + phi;
    const tx = px + L * cos(ang), ty = py - L * sin(ang);
    line(tx, ty, px, ty, {stroke: PH[j], lw: 1, dash: [2, 4]});
    circle(px, ty, 4, {fill: PH[j]});
    phasor(px, py, L, ang, {stroke: PH[j], lw: 2.5}, "i" + "₁₂₃"[j]);
  });
  text({hu: "Áramfázorok – a függőleges vetület a pillanatérték", en: "Current phasors – vertical projection = instantaneous value"},
       px, py + 150, {size: 13, color: C.gray, align: "center"});
  text("nₛ = 60·f / p = " + fmt(60 * P.f / P.p, 0) + " 1/min", px, 430, {size: 20, align: "center", bold: true});
  text("|B| = " + fmt(B.mag / max(P.Im, 1e-9), 2) + " · B̂", px, 465, {size: 18, align: "center"});
  text(P.loss ? {hu: "lüktető mező – a motor nem indul", en: "pulsating field – a motor cannot start"}
              : {hu: "forgó mező, állandó nagyságú", en: "rotating field of constant size"},
       px, 500, {size: 15, align: "center", color: P.loss ? C.red : C.green});

  // Mért értékek a Vezérlők fülön / Readouts on the Controls tab
  show({hu: "Szinkron fordulatszám nₛ", en: "Synchronous speed nₛ"}, 60 * P.f / P.p, "1/min");
  show({hu: "Eredő mező |B| / B̂", en: "Resultant field |B| / B̂"}, B.mag / max(P.Im, 1e-9), "");
  show({hu: "A mező szöge (villamos)", en: "Field angle (electrical)"}, todeg(B.angle), "°");
  for (let j = 0; j < 3; j++) show("i" + "₁₂₃"[j], i[j], "A");

  for (let j = 0; j < 3; j++) plot("i" + "₁₂₃"[j], i[j], {unit: "A", color: PH[j], group: "i"});
  // Élő grafikonok a vászon alatt / Live charts under the canvas
  plot({hu: "|B| / B̂", en: "|B| / B̂"}, B.mag / max(P.Im, 1e-9), {color: C.red, min: 0, max: 2});
});
</script>

<script type="text/plain" id="preset-induction" data-app>// Aszinkron (indukciós) motor – kalickás forgórész
// Induction motor – squirrel-cage rotor
// Közelítő helyettesítő kapcsolás fázisonként, csillagkapcsolás / approximate equivalent circuit per phase, star:
//   s = (nₛ − n) / nₛ       Ī₂' = Ū_f / ((R₁ + R₂'/s) + jX)       Īₘ = Ū_f / (jXₘ)       Ī₁ = Ī₂' + Īₘ
//   M = 3·I₂'²·R₂' / (s·ωₛ)       J·dω/dt = M − M_t
// X és Xₘ 50 Hz-re értendő, a frekvenciával arányosan nő. / X and Xₘ are given at 50 Hz and scale with f.

// Vászon: szélesség, magasság (px), háttérszín / Canvas: width, height (px), background colour
stage(1000, 600, "#fbfbf8");
// Felirat a vászon bal felső sarkában / Caption in the top-left corner
title({hu: "Aszinkron motor", en: "Induction motor"});
// Kezdő lassítás (a Sebesség csúszkán állítható) / Initial slow motion (change it on the Speed slider)
timeScale(0.002);
// A grafikon időablaka másodpercben / Chart time window in seconds
plotWindow(0.5);

// Csúszkák: azonosító, felirat (HU/EN), min, max, alapérték, lépés, egység – értékük: P.azonosító / Sliders: id, label (HU/EN), min, max, default, step, unit – value: P.id
param("U",  {hu: "Vonali feszültség U", en: "Line voltage U"}, 0, 500, 400, 1, "V");
param("f",  {hu: "Frekvencia f", en: "Frequency f"}, 5, 100, 50, 1, "Hz");
param("p",  {hu: "Póluspárok száma p", en: "Pole pairs p"}, 1, 4, 2, 1, "");
param("R1", {hu: "Állórész-ellenállás R₁", en: "Stator resistance R₁"}, 0.1, 10, 1.4, 0.05, "Ω");
param("R2", {hu: "Forgórész-ellenállás R₂'", en: "Rotor resistance R₂'"}, 0.1, 10, 1.2, 0.05, "Ω");
param("X",  {hu: "Szórási reaktancia X₁ + X₂'", en: "Leakage reactance X₁ + X₂'"}, 0.5, 20, 4.4, 0.1, "Ω");
param("Xm", {hu: "Mágnesező reaktancia Xₘ", en: "Magnetising reactance Xₘ"}, 10, 200, 60, 1, "Ω");
param("ML", {hu: "Terhelőnyomaték M_t", en: "Load torque M_L"}, 0, 80, 20, 0.5, "N·m");
// Legördülő lista: [érték, felirat] párok / Drop-down list: [value, label] pairs
choice("load", {hu: "Terhelés jellege", en: "Load type"},
  [["c", {hu: "állandó nyomaték", en: "constant torque"}], ["fan", {hu: "ventilátor (∝ n²)", en: "fan (∝ n²)"}]], "c");
param("J",  {hu: "Tehetetlenségi nyomaték J", en: "Moment of inertia J"}, 0.01, 1, 0.05, 0.01, "kg·m²");
// Kapcsolók: értékük true / false / Switches: their value is true / false
toggle("rev", {hu: "Forgásirány-váltás (L2 ↔ L3)", en: "Reverse rotation (L2 ↔ L3)"}, false);
toggle("vec", {hu: "Mágneses mezővektorok", en: "Magnetic field vectors"}, true);
// Gomb a Vezérlők fülön / Button on the Controls tab
button({hu: "Indítás álló helyzetből", en: "Start from standstill"}, reset);

const PH = [C.L1, C.L2, C.L3];
const sx = 300, sy = 320;   // a gép középpontja / machine centre
const NB = 18;              // forgórészrudak / rotor bars
let th = 0, thr = 0, wr = 0;   // ωt, forgórész szöge és szögsebessége / rotor angle and speed

function machine(w) {       // w: forgórész szögsebessége / rotor speed [rad/s]
  const sg = P.rev ? -1 : 1;                     // a mező forgásiránya / field direction
  const ws = sg * 2 * PI * P.f / P.p;            // szinkron szögsebesség / synchronous speed
  let s = (ws - w) / ws;
  if (abs(s) < 1e-6) s = s < 0 ? -1e-6 : 1e-6;
  const kf = P.f / 50, Uf = P.U / sqrt(3), U = complex(Uf, 0);
  const I2 = U.div(complex(P.R1 + P.R2 / s, P.X * kf));
  const Im = U.div(complex(0, P.Xm * kf));
  const I1 = I2.add(Im);
  const M = sg * 3 * I2.abs() ** 2 * P.R2 / (s * abs(ws));
  return {sg, ws, s, kf, Uf, I1, I2, Im, M};
}
// Terhelőnyomaték: állandó vagy n²-tel arányos (ventilátor) / load torque: constant or ∝ n² (fan)
function loadTorque(w, M) {
  const ws = 2 * PI * P.f / P.p;
  const T = P.load === "fan" ? P.ML * (w / ws) ** 2 : P.ML;
  if (abs(w) < 1e-3 && abs(M) <= T) return M;    // áll / stalled
  return T * sign(w || M);
}

// Fizika: sok kis lépésben fut, dt a lépés hossza (s) / Physics: runs in many small steps, dt is the step length (s)
update(dt => {
  // 10 allépés a pontosabb integráláshoz / 10 sub-steps for accuracy
  const n = 10, h = dt / n;
  for (let k = 0; k < n; k++) {
    const r = machine(wr);
    wr += (r.M - loadTorque(wr, r.M)) / P.J * h;
    thr += wr * h;
  }
  th += 2 * PI * P.f * dt;
});

// Forgórész-feszültség és -áram nyila: a teljes hossz (280 px) az álló forgórészhez tartozik
// Rotor voltage and current arrows: full length (280 px) belongs to the rotor at standstill
boundArrow("E2-nyíl", {
  x: 600, y: 532, angle: 0,                      // kezdőpont, irány: jobbra / start point, direction: right
  length: "280 * E2 / Uf",                       // E₂ = s·E₂₀ → felpörgéskor rövidül / shrinks during run-up
  width: 4, color: "#7c5cd6",
  label: "E₂"
});
boundArrow("I2-nyíl", {
  x: 600, y: 562, angle: 0,
  length: "280 * I2 / I2s",                      // az indítási áramhoz viszonyítva / relative to the starting current
  width: "2 + 4 * I2 / I2s",                     // nagy áramnál vastagabb / thicker at high current
  color: "#2e9e6a",                              // szín kis áramnál / colour at low current
  colorBy: "I2 / I2s", colorMin: 0.2, colorMax: 1,
  colorTo: "#d64045",                            // szín indításkor / colour at start
  label: "I₂'"
});

// Rajzolás minden képkockán (szünetben is) / Drawing on every frame (also while paused)
draw(t => {
  // A gép állapota a mostani fordulatszámon / machine state at the present speed
  const r = machine(wr);
  const axes = P.rev ? [0, deg(240), deg(120)] : [0, deg(120), deg(240)];
  const i1 = phases(sqrt(2) * r.I1.abs(), th, r.I1.arg());   // állórészáramok / stator currents
  const im = phases(sqrt(2) * r.Im.abs(), th, r.Im.arg());   // mágnesező áram / magnetising current
  // Háromfázisú állórész; a vezetőkben ⊙/⊗ az áram iránya / Three-phase stator; ⊙/⊗ shows the current direction
  stator3(sx, sy, {p: P.p, i: i1, imax: sqrt(2) * max(r.I1.abs(), 1e-9), axes: axes});

  // Mezők: B₁ az állórészáramból, Bδ a mágnesezőáramból (légrés), B₂ = Bδ − B₁ a forgórészé
  // Fields: B₁ from stator current, Bδ from magnetising current (air gap), B₂ = Bδ − B₁ from the rotor
  const B1 = fieldVec(i1, axes), Bd = fieldVec(im, axes);
  const B2 = {x: Bd.x - B1.x, y: Bd.y - B1.y};
  B2.mag = hypot(B2.x, B2.y); B2.angle = atan2(B2.y, B2.x);

  // Kalickás forgórész: a rúdáram ott a legnagyobb (⊙), ahol B₂ irányától 90°-kal előrébb járunk
  // Cage rotor: bar current peaks (⊙) 90° ahead of the rotor field axis
  circle(sx, sy, 165, {fill: "#c9ced6", stroke: "#9aa3b1", lw: 1.5});
  for (let j = 0; j < NB; j++) {
    const b = thr + j * 2 * PI / NB;
    const ib = cos(P.p * b - (B2.angle + PI / 2));
    current(sx + 145 * cos(b), sy - 145 * sin(b), abs(ib) > 0.15 && B2.mag > 1e-6 ? sign(ib) : 0, 9,
            {stroke: C.copper, lw: 2, alpha: 0.3 + 0.7 * abs(ib)});
  }
  circle(sx, sy, 42, {fill: "#9aa3b1"});
  line(sx, sy, sx + 42 * cos(thr), sy - 42 * sin(thr), {stroke: C.ink, lw: 3});   // tengelyjel / shaft mark

  if (P.vec) {
    const k = 135 / max(B1.mag, B2.mag, Bd.mag, 1e-9);   // közös lépték / common scale
    for (let m = 0; m < P.p; m++) {
      const off = 2 * PI * m / P.p, lab = m === 0;
      phasor(sx, sy, B1.mag * k, (B1.angle + off) / P.p, {stroke: C.blue, lw: 3}, lab ? "B₁" : "");
      phasor(sx, sy, B2.mag * k, (B2.angle + off) / P.p, {stroke: C.copper, lw: 3}, lab ? "B₂" : "");
      phasor(sx, sy, Bd.mag * k, (Bd.angle + off) / P.p, {stroke: C.red, lw: 4}, lab ? "Bδ" : "");
    }
  }
  circle(sx, sy, 8, {fill: C.ink});

  // ── M(n) jelleggörbe / torque–speed curve ──
  const ns = 60 * P.f / P.p, nNow = abs(wr) * 30 / PI;
  const gx = 590, gb = 400, gw = 370, gh = 250, nTop = ns * 1.1;
  // M(n) görbe a helyettesítő kapcsolásból / M(n) curve from the equivalent circuit
  const curve = [];
  for (let j = 0; j <= 120; j++) {
    const n = nTop * j / 120;
    curve.push([n, r.sg * machine(r.sg * n * PI / 30).M]);
  }
  const Mtop = max(...curve.map(c => c[1]), P.ML * 1.1, 1);
  const X = n => gx + n / nTop * gw, Y = M => gb - max(M, -0.15 * Mtop) / Mtop * gh;   // a generátoros ág levágva / generator branch clipped
  arrow(gx, gb, gx + gw + 18, gb, {stroke: C.gray, lw: 1.2, head: 8, id: "tengelyek"});
  arrow(gx, gb + 30, gx, gb - gh - 25, {stroke: C.gray, lw: 1.2, head: 8, id: "tengelyek"});
  text("n [1/min]", gx + gw + 6, gb + 22, {size: 12, color: C.gray, align: "right"});
  text("M [N·m]", gx + 8, gb - gh - 14, {size: 12, color: C.gray});
  line(X(ns), gb - 5, X(ns), gb + 5, {stroke: C.gray, lw: 1.2});
  text("nₛ = " + fmt(ns, 0), X(ns), gb + 20, {size: 12, color: C.gray, align: "center"});
  text(fmt(Mtop, 0), gx - 6, Y(Mtop) + 4, {size: 11, color: C.gray, align: "right"});
  line(gx - 3, Y(Mtop), gx + 3, Y(Mtop), {stroke: C.gray, lw: 1});
  const lc = curve.map(([n]) => [X(n), Y(P.load === "fan" ? P.ML * (n / ns) ** 2 : P.ML)]);
  polyline(lc, {stroke: C.orange, lw: 2, dash: [6, 4]});
  polyline(curve.map(([n, M]) => [X(n), Y(M)]), {stroke: C.blue, lw: 2.5});
  circle(X(min(nNow, nTop)), Y(r.sg * r.M), 6, {fill: C.red, stroke: "#fff", lw: 1.5});
  text({hu: "M(n) – motor", en: "M(n) – motor"}, gx + 12, gb - gh + 8, {size: 13, color: C.blue, bold: true});
  text({hu: "terhelés", en: "load"}, gx + 12, gb - gh + 26, {size: 13, color: C.orange, bold: true});

  text("s = " + fmt(r.s * 100, 1) + " %      n = " + fmt(r.sg * wr * 30 / PI, 0) + " 1/min", 775, 470, {size: 18, align: "center", bold: true});
  text({hu: "forgórész-frekvencia f₂ = s·f = ", en: "rotor frequency f₂ = s·f = "}, 775, 500, {size: 15, align: "right", color: C.gray});
  text(fmt(abs(r.s) * P.f, 2) + " Hz", 778, 500, {size: 15, color: C.gray});

  // ── Mért értékek / readouts ──
  const Xk = P.X * r.kf;
  // Billenő szlip és billenőnyomaték / breakdown slip and breakdown torque
  const sk = P.R2 / sqrt(P.R1 ** 2 + Xk ** 2);
  const Mk = 3 * r.Uf ** 2 / (2 * abs(r.ws) * (P.R1 + sqrt(P.R1 ** 2 + Xk ** 2)));
  const r0 = machine(0);
  const Pin = 3 * r.Uf * r.I1.re, Pm = r.M * wr;
  val({s: r.s, E2: abs(r.s) * r.Uf, Uf: r.Uf, I1: r.I1.abs(), I2: r.I2.abs(), I2s: r0.I2.abs(), M: r.sg * r.M, n: nNow});   // a Jelölők fülnek / for the Markup tab
  // Mért értékek a Vezérlők fülön / Readouts on the Controls tab
  show({hu: "Szinkron fordulatszám nₛ = 60·f/p", en: "Synchronous speed nₛ = 60·f/p"}, ns, "1/min");
  show({hu: "Fordulatszám n", en: "Speed n"}, nNow, "1/min");
  show({hu: "Szlip s", en: "Slip s"}, r.s * 100, "%");
  show({hu: "Állórészáram I₁", en: "Stator current I₁"}, r.I1.abs(), "A");
  show({hu: "Indítási áram (s = 1)", en: "Starting current (s = 1)"}, r0.I1.abs(), "A");
  show({hu: "Nyomaték M", en: "Torque M"}, r.sg * r.M, "N·m");
  show({hu: "Indítónyomaték", en: "Starting torque"}, r.sg * r0.M, "N·m");
  show({hu: "Billenőnyomaték M_b", en: "Breakdown torque M_b"}, Mk, "N·m");
  show({hu: "Billenő szlip s_b", en: "Breakdown slip s_b"}, sk * 100, "%");
  show({hu: "Felvett teljesítmény P₁", en: "Input power P₁"}, Pin, "W");
  show({hu: "Leadott teljesítmény P₂ = M·ω", en: "Output power P₂ = M·ω"}, Pm, "W");
  show({hu: "Hatásfok η", en: "Efficiency η"}, Pin > 1 && Pm > 0 ? Pm / Pin * 100 : "—", "%");
  show("cos φ", Pin / max(3 * r.Uf * r.I1.abs(), 1e-9), "");

  for (let j = 0; j < 3; j++) plot("i" + "₁₂₃"[j], i1[j], {unit: "A", color: PH[j], group: "i"});
  // Élő grafikonok a vászon alatt / Live charts under the canvas
  plot({hu: "Fordulatszám n", en: "Speed n"}, nNow, {unit: "1/min", color: C.blue, min: 0});
  plot({hu: "Nyomaték M", en: "Torque M"}, r.sg * r.M, {unit: "N·m", color: C.red});
});
</script>

<script type="text/plain" id="preset-synchronous" data-app>// Szinkronmotor – egyenárammal gerjesztett, hengeres forgórész
// Synchronous motor – DC-excited cylindrical rotor
//   M = 3·U_f·E₀ / (ωₛ·X_d) · sin δ  (+ a csillapító kalicka nyomatéka / + damper cage torque)
//   Ī = (Ū − Ē₀) / (jX_d)       δ: terhelési szög / load angle

// Vászon: szélesség, magasság (px), háttérszín / Canvas: width, height (px), background colour
stage(1000, 600, "#fbfbf8");
// Felirat a vászon bal felső sarkában / Caption in the top-left corner
title({hu: "Szinkronmotor", en: "Synchronous motor"});
// Kezdő lassítás (a Sebesség csúszkán állítható) / Initial slow motion (change it on the Speed slider)
timeScale(0.002);
// A grafikon időablaka másodpercben / Chart time window in seconds
plotWindow(1);

// Csúszkák: azonosító, felirat (HU/EN), min, max, alapérték, lépés, egység – értékük: P.azonosító / Sliders: id, label (HU/EN), min, max, default, step, unit – value: P.id
param("U",  {hu: "Vonali feszültség U", en: "Line voltage U"}, 100, 500, 400, 1, "V");
param("f",  {hu: "Frekvencia f", en: "Frequency f"}, 10, 100, 50, 1, "Hz");
param("p",  {hu: "Póluspárok száma p", en: "Pole pairs p"}, 1, 4, 2, 1, "");
param("E",  {hu: "Gerjesztés E₀ / U_f", en: "Excitation E₀ / U_ph"}, 0.3, 2, 1.1, 0.01, "");
param("Xd", {hu: "Szinkron reaktancia X_d (50 Hz)", en: "Synchronous reactance X_d (50 Hz)"}, 1, 30, 8, 0.1, "Ω");
param("ML", {hu: "Terhelőnyomaték M_t", en: "Load torque M_L"}, 0, 200, 60, 1, "N·m");
param("D",  {hu: "Csillapítás (csillapító kalicka)", en: "Damping (damper cage)"}, 0, 20, 3, 0.1, "N·m·s");
param("J",  {hu: "Tehetetlenségi nyomaték J", en: "Moment of inertia J"}, 0.02, 1, 0.1, 0.01, "kg·m²");
// Kapcsolók: értékük true / false / Switches: their value is true / false
toggle("vec", {hu: "Mágneses mezővektorok", en: "Magnetic field vectors"}, true);
toggle("ph",  {hu: "Fázorábra", en: "Phasor diagram"}, true);
// Ezek változásakor a jelenet újraindul / The scene restarts when these change
resetOn("p");
// Gomb a Vezérlők fülön / Button on the Controls tab
button({hu: "Újraszinkronozás", en: "Resynchronise"}, reset);

const PH = [C.L1, C.L2, C.L3];
const sx = 300, sy = 320;

// Gépadatok a csúszkákból; X a frekvenciával arányos / machine data from the sliders; X scales with f
function model() {
  const ws = 2 * PI * P.f / P.p, kf = P.f / 50;
  const Uf = P.U / sqrt(3), E0 = P.E * Uf, X = P.Xd * kf;
  return {ws, Uf, E0, X, Mmax: 3 * Uf * E0 / (ws * X)};
}

// Indulás szinkron fordulatszámon, a terheléshez illő δ-val / start in sync with the matching load angle
let th = 0;
const m0 = model();
const d0 = asin(clamp(P.ML / m0.Mmax, -1, 1));
let thm = (th - PI - d0) / P.p;   // forgórész mechanikai szöge / rotor mechanical angle
let wm = m0.ws;
// A forgórész É-i pólusa a hálózati eredő mező mögött δ-val jár / the rotor's N pole lags the network field by δ
const loadAngle = () => wrap(th - PI - P.p * thm);

// Fizika: sok kis lépésben fut, dt a lépés hossza (s) / Physics: runs in many small steps, dt is the step length (s)
update(dt => {
  // 10 allépés a pontosabb integráláshoz / 10 sub-steps for accuracy
  const n = 10, h = dt / n;
  for (let k = 0; k < n; k++) {
    const m = model(), d = loadAngle();
    // Szinkronozó nyomaték + a csillapító kalicka nyomatéka / synchronising torque + damper-cage torque
    const M = m.Mmax * sin(d) + P.D * (m.ws - wm);
    let Ml = P.ML;
    if (wm < 0.01 && M < Ml) Ml = max(M, 0);   // nem fordul vissza / does not run backwards
    wm = max(0, wm + (M - Ml) / P.J * h);
    thm += wm * h;
    th += 2 * PI * P.f * h;
  }
});

// Nyomatéknyilak: 200 px = billenőnyomaték; a Jelölők fülön is szerkeszthetők
// Torque arrows: 200 px = pull-out torque; also editable on the Markup tab
boundArrow("M-nyíl", {
  x: 620, y: 150, angle: 0,                      // kezdőpont, irány: jobbra / start point, direction: right
  length: "200 * M / Mmax",                      // hossz px-ben / length in px
  width: 4, color: "#d64045",
  label: "M = {M:0} N·m"                         // {M:0}: M értéke egészre kerekítve / value of M, rounded
});
boundArrow("Mt-nyíl", {
  x: 620, y: 182, angle: 0,
  length: "200 * ML / Mmax",
  width: 4, color: "#e8862a",
  label: "Mt"
});

// Rajzolás minden képkockán (szünetben is) / Drawing on every frame (also while paused)
draw(t => {
  const m = model(), d = loadAngle();
  // Fázorok: Ū, Ē₀ = E₀∠−δ, Ī = (Ū − Ē₀)/(jX) / phasors
  const U = complex(m.Uf, 0), E = cpolar(m.E0, -d);
  const I = U.sub(E).div(complex(0, m.X));
  const axes = [0, deg(120), deg(240)];
  const ia = phases(sqrt(2) * I.abs(), th, I.arg());
  // Háromfázisú állórész; a vezetőkben ⊙/⊗ az áram iránya / Three-phase stator; ⊙/⊗ shows the current direction
  stator3(sx, sy, {p: P.p, i: ia, imax: sqrt(2) * max(I.abs(), 1e-9), axes: axes});

  // Forgórész: 2p pólus, felváltva É és D / rotor: 2p poles, alternating N and S
  circle(sx, sy, 160, {fill: "#c9ced6", stroke: "#9aa3b1", lw: 1.5});
  for (let j = 0; j < 2 * P.p; j++) {
    const a = thm + j * PI / P.p, N = j % 2 === 0;
    const px = sx + 112 * cos(a), py = sy - 112 * sin(a);
    box(px, py, 72, min(110, 280 / P.p), -a, {fill: N ? C.N : C.S, radius: 6});
    text(N ? "N" : "S", px, py + 7, {size: 20, bold: true, color: "#fff", align: "center"});
  }
  circle(sx, sy, 30, {fill: "#9aa3b1"});

  // A hálózati eredő mező tengelye és a δ szög / network field axis and the load angle δ
  const fa = (th - PI) / P.p;
  line(sx, sy, sx + 170 * cos(fa), sy - 170 * sin(fa), {stroke: C.red, lw: 1.5, dash: [6, 5]});
  const s1 = -thm, s2 = -(thm + d / P.p);   // képernyőszögek / screen angles
  arc(sx, sy, 58, min(s1, s2), max(s1, s2), {stroke: C.ink, lw: 2});
  const am = thm + d / (2 * P.p);
  text("δ", sx + 74 * cos(am), sy - 74 * sin(am) + 6, {size: 18, italic: true, bold: true, align: "center"});

  if (P.vec) {
    const B1 = fieldVec(ia, axes);                         // állórész / stator
    const ifq = 1.5 * sqrt(2) * m.E0 / m.X;                // gerjesztés áram-egyenértéke / excitation as equivalent current
    const ra = th - PI - d;                                // = p·thm, a forgórész tengelye / rotor axis
    const B2 = {x: ifq * cos(ra), y: ifq * sin(ra)};
    const Bd = {x: B1.x + B2.x, y: B1.y + B2.y};
    const mags = [B1.mag, hypot(B2.x, B2.y), hypot(Bd.x, Bd.y)];
    const k = 140 / max(...mags, 1e-9);
    for (let j = 0; j < P.p; j++) {
      const off = 2 * PI * j / P.p, lab = j === 0;
      phasor(sx, sy, mags[0] * k, (B1.angle + off) / P.p, {stroke: C.blue, lw: 3}, lab ? "B₁" : "");
      phasor(sx, sy, mags[1] * k, (atan2(B2.y, B2.x) + off) / P.p, {stroke: C.copper, lw: 3}, lab ? "B₂" : "");
      phasor(sx, sy, mags[2] * k, (atan2(Bd.y, Bd.x) + off) / P.p, {stroke: C.red, lw: 4}, lab ? "Bδ" : "");
    }
  }
  circle(sx, sy, 7, {fill: C.ink});

  // ── Fázorábra egy fázisra (Ū függőleges) / phasor diagram for one phase (Ū vertical) ──
  if (P.ph) {
    const ox = 760, oy = 470, ku = 170 / max(m.Uf, m.E0), up = PI / 2;
    text({hu: "Fázorábra (1 fázis)", en: "Phasor diagram (one phase)"}, 600, 100, {size: 14, color: C.gray});
    phasor(ox, oy, m.Uf * ku, up, {stroke: C.ink, lw: 3}, "U");
    phasor(ox, oy, m.E0 * ku, E.arg() + up, {stroke: C.copper, lw: 3}, "E₀");
    const jXI = U.sub(E);
    const ex = ox + m.E0 * ku * cos(E.arg() + up), ey = oy - m.E0 * ku * sin(E.arg() + up);
    phasor(ex, ey, jXI.abs() * ku, jXI.arg() + up, {stroke: C.purple, lw: 2, dash: [6, 4]}, "jX·I");
    const ki = 110 / (m.Uf / m.X);
    phasor(ox, oy, min(200, I.abs() * ki), I.arg() + up, {stroke: C.blue, lw: 2.5}, "I");
    arc(ox, oy, 46, min(-up, d - up), max(-up, d - up), {stroke: C.ink, lw: 1.5});
    circle(ox, oy, 4, {fill: C.ink});
  }

  // ── Mért értékek / readouts ──
  const ns = 60 * P.f / P.p, n = wm * 30 / PI;
  const S = U.mul(I.conj()).scale(3);                 // P + jQ felvett / consumed
  const inSync = abs(wm - m.ws) < 0.02 * m.ws;
  const Me = m.Mmax * sin(d) + P.D * (m.ws - wm);
  val({M: Me, Mmax: m.Mmax, ML: P.ML, delta: todeg(d), E0: m.E0, Uf: m.Uf, I: I.abs(), n: n});   // a Jelölők fülnek / for the Markup tab
  // Mért értékek a Vezérlők fülön / Readouts on the Controls tab
  show({hu: "Állapot", en: "State"}, tr(inSync ? {hu: "szinkronban", en: "in synchronism"} : {hu: "KIESETT a szinkronizmusból", en: "OUT OF STEP"}), "");
  show({hu: "Szinkron fordulatszám nₛ", en: "Synchronous speed nₛ"}, ns, "1/min");
  show({hu: "Fordulatszám n", en: "Speed n"}, n, "1/min");
  show({hu: "Terhelési szög δ", en: "Load angle δ"}, todeg(d), "°");
  show({hu: "Nyomaték M", en: "Torque M"}, Me, "N·m");
  show({hu: "Billenőnyomaték M_max (δ = 90°)", en: "Pull-out torque M_max (δ = 90°)"}, m.Mmax, "N·m");
  show({hu: "Állórészáram I", en: "Stator current I"}, I.abs(), "A");
  show("cos φ", S.re / max(S.abs(), 1e-9), "");
  show({hu: "Jelleg", en: "Character"}, tr(S.im > 0.02 * S.abs() ? {hu: "induktív – alulgerjesztett", en: "inductive – under-excited"}
       : S.im < -0.02 * S.abs() ? {hu: "kapacitív – túlgerjesztett", en: "capacitive – over-excited"} : {hu: "ohmos (cos φ ≈ 1)", en: "resistive (cos φ ≈ 1)"}), "");
  show({hu: "Hatásos teljesítmény P", en: "Active power P"}, S.re, "W");
  show({hu: "Meddő teljesítmény Q", en: "Reactive power Q"}, S.im, "var");

  // Élő grafikonok a vászon alatt / Live charts under the canvas
  plot({hu: "Terhelési szög δ", en: "Load angle δ"}, todeg(d), {unit: "°", color: C.purple});
  for (let j = 0; j < 3; j++) plot("i" + "₁₂₃"[j], ia[j], {unit: "A", color: PH[j], group: "i"});
  plot({hu: "Fordulatszám n", en: "Speed n"}, n, {unit: "1/min", color: C.blue});
});
</script>

<script type="text/plain" id="preset-loop3d" data-app>// Forgó vezetőkeret homogén mágneses térben – 3D nézet
// Rotating loop in a uniform magnetic field – 3D view
//   Φ = B·A·cos α  (α: az n normálvektor és B szöge, α = θ + 90°)      u = −N·dΦ/dt = N·B·A·ω·cos θ
// 3D tengelyek: x jobbra (a tér iránya), y felfelé, z a forgástengely / 3D axes: x right (field), y up, z = rotation axis

// Vászon: szélesség, magasság (px), háttérszín / Canvas: width, height (px), background colour
stage(1000, 600, "#fbfbf8");
// Felirat a vászon bal felső sarkában / Caption in the top-left corner
title({hu: "Forgó vezetőkeret mágneses térben", en: "Rotating loop in a magnetic field"});
// Kezdő lassítás (a Sebesség csúszkán állítható) / Initial slow motion (change it on the Speed slider)
timeScale(0.025);
// A grafikon időablaka másodpercben / Chart time window in seconds
plotWindow(3);

// Csúszkák: azonosító, felirat (HU/EN), min, max, alapérték, lépés, egység – értékük: P.azonosító / Sliders: id, label (HU/EN), min, max, default, step, unit – value: P.id
param("n",     {hu: "Fordulatszám n", en: "Speed n"}, 0, 300, 60, 1, "1/min");
param("B",     {hu: "Mágneses indukció B", en: "Flux density B"}, 0, 1.5, 0.8, 0.01, "T");
param("N",     {hu: "Menetszám N", en: "Number of turns N"}, 1, 500, 100, 1, "");
param("A",     {hu: "Keret felülete A", en: "Loop area A"}, 10, 400, 100, 1, "cm²");
param("yaw",   {hu: "Nézet: elforgatás", en: "View: turn"}, -90, 90, -38, 1, "°");
param("pitch", {hu: "Nézet: dőlés", en: "View: tilt"}, -30, 70, 20, 1, "°");
// Kapcsolók: értékük true / false / Switches: their value is true / false
toggle("field", {hu: "Erővonalak", en: "Field lines"}, true);
toggle("cur",   {hu: "Indukált áram iránya", en: "Direction of the induced current"}, true);
toggle("vec",   {hu: "Normálvektor és sebesség", en: "Normal vector and velocity"}, true);

let th = 0, u = 0, curPos = 0, fieldPos = 0;

// Fizika: sok kis lépésben fut, dt a lépés hossza (s) / Physics: runs in many small steps, dt is the step length (s)
update(dt => {
  const w = P.n * PI / 30;
  th += w * dt;
  u = P.N * P.B * P.A * 1e-4 * w * cos(th);
  curPos += -2.2 * cos(th) * sign(w) * dt;   // v × B: az „A” oldalon −z irányú, ha cos θ > 0 / along −z on side A when cos θ > 0
  fieldPos += 1.2 * P.B * dt;
});

// Rajzolás minden képkockán (szünetben is) / Drawing on every frame (also while paused)
draw(t => {
  // 3D nézet: középpont, lépték (px/egység), elforgatás, dőlés / 3D view: centre, scale (px per unit), turn, tilt
  view3d({x: 480, y: 335, scale: 82, yaw: deg(P.yaw), pitch: deg(P.pitch), dist: 16});
  // Innentől a 3D elemek mélység szerint rendeződnek / From here, 3D items are depth-sorted
  begin3();
  // Pólusok / poles
  box3([-3.5, 0, 0], [1.3, 3.4, 4.0], {fill: C.N});
  box3([3.5, 0, 0], [1.3, 3.4, 4.0], {fill: C.S});
  text3("N", [-3.5, 2.4, 0], {size: 28, bold: true, color: C.N, align: "center"});
  text3("S", [3.5, 2.4, 0], {size: 28, bold: true, color: C.S, align: "center"});

  // Erővonalak N-től S felé / field lines from N to S
  if (P.field && P.B > 0.001) {
    for (const y of [-1.2, 0, 1.2]) for (const z of [-1.4, 0, 1.4]) {
      const fl = [[-2.85, y, z], [2.85, y, z]];
      path3(fl, {stroke: "#c8963e", lw: 1.3, alpha: 0.75});
      flow3(fl, {pos: fieldPos, dir: 1, spacing: 1.9, size: 9, color: "#e0663a", id: "erővonal"});
    }
  }

  // Tengely és keret: a keret oldalai a z tengellyel párhuzamosak / shaft and loop: the sides run parallel to z
  wire3([[0, 0, -2.6], [0, 0, 2.9]], {color: "#9aa3b1", lw: 6});
  const a = 1.05, L = 1.55, c = cos(th), s = sin(th);
  // A keret négy sarka; θ szöggel elforgatva a z tengely körül / the loop’s four corners, turned by θ about z
  const loop = [[a * c, a * s, -L], [a * c, a * s, L], [-a * c, -a * s, L], [-a * c, -a * s, -L]];
  wire3(loop, {color: C.orange, lw: 9}, true);
  text3("A", [a * c * 1.3, a * s * 1.3, -L], {size: 16, bold: true, color: C.orange});

  if (P.cur && P.n > 0) {
    const al = clamp(abs(c) * 2, 0, 1);
    if (al > 0.05) flow3(loop, {pos: curPos, dir: -sign(c), spacing: 1.1, size: 13, color: C.blue, alpha: al, id: "indukált áram"}, true);
  }
  if (P.vec) {
    arrow3([0, 0, 0], [-1.7 * s, 1.7 * c, 0], {stroke: C.purple, lw: 3, id: "normálvektor n"});
    text3("n", [-1.95 * s, 1.95 * c, 0], {size: 18, bold: true, italic: true, color: C.purple});
    if (P.n > 0) {
      arrow3([a * c, a * s, 0], [a * c - 0.9 * s, a * s + 0.9 * c, 0], {stroke: C.green, lw: 3, id: "sebesség v"});
      text3("v", [a * c - 1.15 * s, a * s + 1.15 * c, 0], {size: 18, bold: true, italic: true, color: C.green});
    }
  }
  // A 3D elemek kirajzolása (a távoliak előbb) / Draw the 3D items (far ones first)
  end3();

  text({hu: "u akkor a legnagyobb, amikor Φ = 0: a keret oldalai ekkor metszik a legtöbb erővonalat",
        en: "u peaks when Φ = 0: that is when the sides cut the most field lines"}, 22, 64, {size: 13, color: C.gray});

  const w = P.n * PI / 30, Phi = -P.B * P.A * 1e-4 * sin(th);
  // Mért értékek a Vezérlők fülön / Readouts on the Controls tab
  show({hu: "Elfordulás θ", en: "Angle θ"}, todeg(mod(th, 2 * PI)), "°");
  show({hu: "Fluxus Φ", en: "Flux Φ"}, Phi * 1000, "mWb");
  show({hu: "Indukált feszültség u", en: "Induced voltage u"}, u, "V");
  show({hu: "Csúcsérték Û = N·B·A·ω", en: "Peak value Û = N·B·A·ω"}, P.N * P.B * P.A * 1e-4 * w, "V");
  show({hu: "Frekvencia f = n/60", en: "Frequency f = n/60"}, P.n / 60, "Hz");
  // Élő grafikonok a vászon alatt / Live charts under the canvas
  plot({hu: "Fluxus Φ", en: "Flux Φ"}, Phi * 1000, {unit: "mWb", color: C.purple});
  plot({hu: "Feszültség u", en: "Voltage u"}, u, {unit: "V", color: C.blue});
});
</script>

<script type="text/plain" id="preset-cage3d" data-app>// Kalickás forgórész forgó mágneses mezőben – 3D nézet (p = 1)
// Squirrel-cage rotor in a rotating magnetic field – 3D view (p = 1)
// A rudakban csak akkor indukálódik áram, ha a mező gyorsabban forog, mint a forgórész (s > 0).
// Current is induced in the bars only while the field turns faster than the rotor (s > 0).
// 3D tengelyek: x a forgástengely, y felfelé / 3D axes: x along the shaft, y up

// Vászon: szélesség, magasság (px), háttérszín / Canvas: width, height (px), background colour
stage(1000, 600, "#fbfbf8");
// Felirat a vászon bal felső sarkában / Caption in the top-left corner
title({hu: "Kalickás forgórész forgó mezőben", en: "Cage rotor in a rotating field"});
// Kezdő lassítás (a Sebesség csúszkán állítható) / Initial slow motion (change it on the Speed slider)
timeScale(0.002);
// A grafikon időablaka másodpercben / Chart time window in seconds
plotWindow(0.06);

// Csúszkák: azonosító, felirat (HU/EN), min, max, alapérték, lépés, egység – értékük: P.azonosító / Sliders: id, label (HU/EN), min, max, default, step, unit – value: P.id
param("f",     {hu: "Frekvencia f", en: "Frequency f"}, 1, 60, 50, 1, "Hz");
param("s",     {hu: "Szlip s", en: "Slip s"}, 0, 1, 0.25, 0.01, "");
param("yaw",   {hu: "Nézet: elforgatás", en: "View: turn"}, -90, 90, -28, 1, "°");
param("pitch", {hu: "Nézet: dőlés", en: "View: tilt"}, -30, 70, 16, 1, "°");
// Kapcsolók: értékük true / false / Switches: their value is true / false
toggle("coils", {hu: "Állórész-tekercsek", en: "Stator coils"}, true);
toggle("field", {hu: "Mágneses erővonalak", en: "Magnetic field lines"}, true);
param("x2",    {hu: "Forgórész X₂ / R₂ (álló forgórésznél)", en: "Rotor X₂ / R₂ (at standstill)"}, 0, 5, 1.5, 0.1, "");
// Legördülő lista: [érték, felirat] párok / Drop-down list: [value, label] pairs
choice("bars", {hu: "Nyilak a rudakon", en: "Arrows on the bars"},
  [["both", {hu: "feszültség és áram", en: "voltage and current"}], ["i", {hu: "csak áram", en: "current only"}],
   ["e", {hu: "csak feszültség", en: "voltage only"}], ["off", {hu: "nincs", en: "none"}]], "both");

const PH = [C.L1, C.L2, C.L3];          // klasszikus színek / classic colours: [C.red, C.yellow, C.blue]
const AXES = [0, deg(120), deg(240)];   // tekercstengelyek / coil axes
const NB = 14, R0 = 1.0, L = 1.7, LC = 2.0, RC = 1.35;
let th = 0, thr = 0, fieldPos = 0;          // ωt, a forgórész szöge, az erővonal-nyilak eltolása / ωt, rotor angle, field-arrow offset
const coilPos = [0, 0, 0];                  // a tekercsáram-nyilak eltolása / coil-current arrow offsets

// A mező iránya a keresztmetszetben (villamos szög) / field direction in the cross-section (electrical angle)
const fieldAngle = () => fieldVec(phases(1, th), AXES).angle;

// Egy rúd feszültsége és árama, −1 … 1 (+ = a tengely mentén +x)
// Voltage and current of one bar, −1 … 1 (+ = along +x)
//   e ∝ s·cos(β − φ)             a mező s-sel arányos sebességgel halad el a rúd mellett / the field passes the bar at a speed ∝ s
//   i = e / Z₂,  Z₂ = R₂ + j·s·X₂  → az áram φ₂ = arc tg(s·X₂/R₂) szöggel késik / the current lags by φ₂
function barValues(j) {
  const rel = thr + j * 2 * PI / NB - fieldAngle();
  const phi2 = atan(P.s * P.x2);
  const iAmp = P.s * sqrt(1 + P.x2 ** 2) / sqrt(1 + (P.s * P.x2) ** 2);   // s = 1-nél 1 / equals 1 at s = 1
  return {e: P.s * cos(rel), i: iAmp * cos(rel + phi2)};
}

// Fizika: sok kis lépésben fut, dt a lépés hossza (s) / Physics: runs in many small steps, dt is the step length (s)
update(dt => {
  const w = 2 * PI * P.f, v = 2.2 * P.f;   // a mozgó nyilak sebessége periódusonként / moving-arrow speed per period
  th += w * dt;                           // a mező (hálózat) szöge / field (supply) angle
  thr += w * (1 - P.s) * dt;              // a forgórész s szliptel lassabban forog / the rotor turns slower by the slip s
  const i = phases(1, th);                // a három fázisáram / the three phase currents
  for (let k = 0; k < 3; k++) coilPos[k] += v * i[k] * dt;
  fieldPos += 0.8 * v * dt;
});

// Rajzolás minden képkockán (szünetben is) / Drawing on every frame (also while paused)
draw(t => {
  // 3D nézet: középpont, lépték (px/egység), elforgatás, dőlés / 3D view: centre, scale (px per unit), turn, tilt
  view3d({x: 500, y: 320, scale: 105, yaw: deg(P.yaw), pitch: deg(P.pitch), dist: 14});
  const phi = fieldAngle(), i = phases(1, th);
  const d = [cos(phi), sin(phi)], e = [-sin(phi), cos(phi)];   // a mező iránya a keresztmetszetben / field direction in the cross-section
  // Innentől a 3D elemek mélység szerint rendeződnek / From here, 3D items are depth-sorted
  begin3();

  // Tengely, rövidrezáró gyűrűk és rudak / shaft, end rings and bars
  wire3([[-L - 1.5, 0, 0], [L + 1.2, 0, 0]], {color: "#a7afba", lw: 18});
  wire3(circle3([-L, 0, 0], "x", R0), {color: "#a7afba", lw: 9}, true);
  wire3(circle3([L, 0, 0], "x", R0), {color: "#a7afba", lw: 9}, true);
  for (let j = 0; j < NB; j++) {
    const b = thr + j * 2 * PI / NB, y = R0 * cos(b), z = R0 * sin(b);
    wire3([[-L, y, z], [L, y, z]], {color: "#b9c0ca", lw: 5});            // a rúd / the bar
    // A nyíl hossza az értékkel arányos, iránya az előjellel / arrow length follows the value, direction its sign
    const v = barValues(j), A = 1.45;                                        // A: a nyíl fél hossza ±1-nél / half length at ±1
    if ((P.bars === "both" || P.bars === "i") && abs(v.i) > 0.03)
      arrow3([-A * v.i, y, z], [A * v.i, y, z], {stroke: C.blue, lw: 4, id: "rúdáram i"});
    if ((P.bars === "both" || P.bars === "e") && abs(v.e) > 0.03)
      arrow3([-A * v.e, 1.14 * y, 1.14 * z], [A * v.e, 1.14 * y, 1.14 * z], {stroke: C.purple, lw: 2.5, id: "rúdfeszültség e"});
  }

  // Erővonalak két keresztmetszetben: a forgórészen át +d irányban / field lines in two slices: across the rotor along +d
  if (P.field) {
    for (const x of [-0.85, 0.85]) for (const sg of [1, -1]) for (const [ae, ad] of [[0.72, 1.6], [0.38, 1.28]]) {
      const loop = [];
      for (let k = 0; k < 60; k++) {
        const u = k / 60 * 2 * PI, ds = ad * sin(u), es = sg * (0.75 - ae * cos(u));
        loop.push([x, d[0] * ds + e[0] * es, d[1] * ds + e[1] * es]);
      }
      path3(loop, {stroke: "#c8963e", lw: 1.6, alpha: 0.85}, true);
      flow3(loop, {pos: fieldPos, dir: 1, spacing: 1.3, size: 10, color: "#e0663a", id: "erővonal"}, true);
    }
    text3("N", [-L - 0.4, -1.9 * d[0], -1.9 * d[1]], {size: 24, bold: true, color: C.N, align: "center"});
    text3("S", [-L - 0.4, 1.9 * d[0], 1.9 * d[1]], {size: 24, bold: true, color: C.S, align: "center"});
  }
  text({hu: "kék: rúdáram i   ·   lila: indukált feszültség e   (a nyíl hossza ∝ érték)",
        en: "blue: bar current i   ·   purple: induced voltage e   (arrow length ∝ value)"}, 22, 64, {size: 13, color: C.gray});

  // Állórész-tekercsek (nyereg alakú): menőoldal az α + 90°-nál / stator coils (saddle): go side at α + 90°
  if (P.coils) for (let k = 0; k < 3; k++) {
    const a1 = AXES[k] + PI / 2, a2 = AXES[k] - PI / 2, rc = RC + k * 0.07, pts = [];
    const at = (x, a) => [x, rc * cos(a), rc * sin(a)];
    pts.push(at(-LC, a1), at(LC, a1));
    for (let q = 1; q < 24; q++) pts.push(at(LC, a1 - q / 24 * PI));
    pts.push(at(LC, a2), at(-LC, a2));
    for (let q = 1; q < 24; q++) pts.push(at(-LC, a2 + q / 24 * PI));
    wire3(pts, {color: PH[k], lw: 7}, true);
    if (abs(i[k]) > 0.08) flow3(pts, {pos: coilPos[k], dir: sign(i[k]), spacing: 1.4, size: 12, color: "#1e9bd7", alpha: min(1, abs(i[k]) * 1.4), id: "tekercsáram"}, true);
    text3("L" + (k + 1), at(LC + 0.45, AXES[k]), {size: 15, bold: true, color: PH[k], align: "center"});
  }
  // A 3D elemek kirajzolása (a távoliak előbb) / Draw the 3D items (far ones first)
  end3();

  // Mért értékek a Vezérlők fülön / Readouts on the Controls tab
  show({hu: "Szinkron fordulatszám nₛ = 60·f", en: "Synchronous speed nₛ = 60·f"}, 60 * P.f, "1/min");
  show({hu: "Forgórész n = (1 − s)·nₛ", en: "Rotor speed n = (1 − s)·nₛ"}, (1 - P.s) * 60 * P.f, "1/min");
  show({hu: "Rúdáram frekvenciája f₂ = s·f", en: "Bar current frequency f₂ = s·f"}, P.s * P.f, "Hz");
  show({hu: "Az áram késése φ₂ = arc tg(s·X₂/R₂)", en: "Current lag φ₂ = atan(s·X₂/R₂)"}, todeg(atan(P.s * P.x2)), "°");
  val({s: P.s, f2: P.s * P.f, phi2: todeg(atan(P.s * P.x2)), n: (1 - P.s) * 60 * P.f});   // a Jelölők fülnek / for the Markup tab
  show({hu: "Állapot", en: "State"}, tr(P.s > 0 ? {hu: "a mező elhalad a rudak mellett → áram, nyomaték", en: "the field slips past the bars → current, torque"}
                                                 : {hu: "n = nₛ: nincs indukált áram, nincs nyomaték", en: "n = nₛ: no induced current, no torque"}), "");
  for (let k = 0; k < 3; k++) plot("i" + "₁₂₃"[k], i[k], {color: PH[k], group: "i"});
});
</script>

<script type="text/plain" id="preset-projectile" data-app>// Ferde hajítás – opcionális légellenállással és visszapattanással
// Projectile motion – optional air drag and bouncing
//   x = v₀·cos α·t        y = h + v₀·sin α·t − g·t²/2

// Vászon: szélesség, magasság (px), háttérszín / Canvas: width, height (px), background colour
stage(1000, 600, "#f7f9fc");
// Felirat a vászon bal felső sarkában / Caption in the top-left corner
title({hu: "Ferde hajítás", en: "Projectile motion"});
// A grafikon időablaka másodpercben / Chart time window in seconds
plotWindow(4);

// Csúszkák: azonosító, felirat (HU/EN), min, max, alapérték, lépés, egység – értékük: P.azonosító / Sliders: id, label (HU/EN), min, max, default, step, unit – value: P.id
param("v0",  {hu: "Kezdősebesség v₀", en: "Launch speed v₀"}, 1, 20, 14, 0.5, "m/s");
param("ang", {hu: "Hajítási szög α", en: "Launch angle α"}, 0, 90, 45, 1, "°");
param("h",   {hu: "Kezdőmagasság h", en: "Launch height h"}, 0, 10, 0, 0.5, "m");
param("g",   {hu: "Nehézségi gyorsulás g", en: "Gravity g"}, 1, 25, 9.81, 0.01, "m/s²");
param("k",   {hu: "Légellenállás k", en: "Air drag k"}, 0, 0.3, 0, 0.005, "1/m");
param("e",   {hu: "Visszapattanás e", en: "Restitution e"}, 0, 0.9, 0.4, 0.05, "");
// Kapcsolók: értékük true / false / Switches: their value is true / false
toggle("vec",   {hu: "Sebességvektorok", en: "Velocity vectors"}, true);
toggle("ideal", {hu: "Elméleti pálya (k = 0)", en: "Ideal path (k = 0)"}, true);
resetOn("v0", "ang", "h", "g");    // ezek változásakor újraindul / restart when these change
// Gomb a Vezérlők fülön / Button on the Controls tab
button({hu: "Újra dobás", en: "Throw again"}, reset);

// Fizikai világ: méterben, y felfelé; scale = px/m / Physics world: metres, y up; scale = px per metre
const W = world({gravity: P.g, scale: 20, origin: [60, 540], ground: true, restitution: P.e, friction: 0.3});
const r = 0.3;
const a = deg(P.ang);
// A hajított test / the projectile
const B = ball({x: 0, y: P.h + r, vx: P.v0 * cos(a), vy: P.v0 * sin(a), r: r, color: C.orange, trail: 600});
let ymax = B.y, range = null;

// Fizika: sok kis lépésben fut, dt a lépés hossza (s) / Physics: runs in many small steps, dt is the step length (s)
update((dt, t) => {
  W.e = P.e;
  if (P.k > 0) {                       // F = −k·m·|v|·v
    const v = hypot(B.vx, B.vy);
    B.applyForce(-P.k * B.m * v * B.vx, -P.k * B.m * v * B.vy);
  }
  ymax = max(ymax, B.y);
  // Első földet éréskor feljegyezzük a távolságot / record the range at the first touchdown
  if (range === null && B.onGround && t > 0.02) range = B.x;
});

// Rajzolás minden képkockán (szünetben is) / Drawing on every frame (also while paused)
draw(t => {
  // Tengelyek / axes
  for (let x = 0; x <= 45; x += 5) {
    line(wx(x), wy(0), wx(x), wy(0) + 8, {stroke: C.gray, lw: 1});
    text(x + " m", wx(x), wy(0) + 26, {size: 12, color: C.gray, align: "center"});
  }
  for (let y = 5; y <= 25; y += 5) {
    line(wx(0) - 6, wy(y), R_W(), wy(y), {stroke: "rgba(40,60,90,0.07)", lw: 1});
    text(y + " m", wx(0) - 10, wy(y) + 4, {size: 12, color: C.gray, align: "right"});
  }
  if (P.h > 0) rect(wx(-1.2), wy(P.h), ws(1.2), ws(P.h), {fill: "#e3e8ef", stroke: C.gray, lw: 1});

  // Elméleti parabola / ideal parabola
  if (P.ideal && P.ang < 89.5) {
    const pts = [];
    for (let x = 0; x < 60; x += 0.2) {
      const y = P.h + r + x * tan(a) - P.g * x * x / (2 * P.v0 * P.v0 * cos(a) ** 2);
      pts.push([wx(x), wy(y)]);
      if (y < r) break;
    }
    polyline(pts, {stroke: C.blue, lw: 1.5, dash: [6, 6], alpha: 0.8});
  }

  // Hajítószerkezet / launcher
  push(); translate(wx(0), wy(P.h + r)); rotate(-a);
  rect(-6, -7, 46, 14, {fill: C.ink, radius: 3});
  pop();

  // A fizikai világ (golyók, talaj) kirajzolása / Draw the physics world (balls, ground)
  drawWorld();

  if (P.vec) {
    const s = 6;   // px per m/s
    const X = wx(B.x), Y = wy(B.y);
    vector(X, Y, B.vx * s, 0, {stroke: C.blue, lw: 2}, "vx");
    vector(X, Y, 0, -B.vy * s, {stroke: C.green, lw: 2}, "vy");
    vector(X, Y, B.vx * s, -B.vy * s, {stroke: C.ink, lw: 2.5}, "v");
  }

  const vs = P.v0 * sin(a), vc = P.v0 * cos(a);
  // Mért értékek a Vezérlők fülön / Readouts on the Controls tab
  show({hu: "Idő t", en: "Time t"}, t, "s");
  show({hu: "Vízszintes hely x", en: "Horizontal position x"}, B.x, "m");
  show({hu: "Magasság y", en: "Height y"}, B.y - r, "m");
  show({hu: "Sebesség |v|", en: "Speed |v|"}, B.speed, "m/s");
  show({hu: "Legnagyobb magasság", en: "Maximum height"}, ymax - r, "m");
  show({hu: "Hajítás távolsága", en: "Range"}, range === null ? "…" : range, "m");
  show({hu: "Távolság (elmélet, k = 0)", en: "Range (theory, k = 0)"}, vc * (vs + sqrt(vs * vs + 2 * P.g * P.h)) / P.g, "m");

  // Élő grafikonok a vászon alatt / Live charts under the canvas
  plot({hu: "Magasság y", en: "Height y"}, B.y - r, {unit: "m", color: C.orange});
  plot({hu: "Függőleges sebesség vy", en: "Vertical velocity vy"}, B.vy, {unit: "m/s", color: C.green});
});

function R_W() { return 990; }
</script>

<script type="text/plain" id="preset-incline" data-app>// Lejtő súrlódással – az erők felbontása
// Inclined plane with friction – resolving the forces
//   a = g·(sin α − μ·cos α), ha tg α > μ  /  if tan α > μ

// Vászon: szélesség, magasság (px), háttérszín / Canvas: width, height (px), background colour
stage(1000, 600, "#f8f9fb");
// Felirat a vászon bal felső sarkában / Caption in the top-left corner
title({hu: "Lejtő", en: "Inclined plane"});
// A grafikon időablaka másodpercben / Chart time window in seconds
plotWindow(4);

// Csúszkák: azonosító, felirat (HU/EN), min, max, alapérték, lépés, egység – értékük: P.azonosító / Sliders: id, label (HU/EN), min, max, default, step, unit – value: P.id
param("alpha", {hu: "Hajlásszög α", en: "Angle α"}, 0, 60, 30, 1, "°");
param("mu",    {hu: "Súrlódási együttható μ", en: "Friction coefficient μ"}, 0, 1, 0.25, 0.01, "");
param("m",     {hu: "Tömeg m", en: "Mass m"}, 0.5, 20, 2, 0.5, "kg");
param("g",     {hu: "Nehézségi gyorsulás g", en: "Gravity g"}, 1, 25, 9.81, 0.01, "m/s²");
// Kapcsolók: értékük true / false / Switches: their value is true / false
toggle("comp", {hu: "mg összetevői", en: "Components of mg"}, true);
// Ezek változásakor a jelenet újraindul / The scene restarts when these change
resetOn("alpha");
// Gomb a Vezérlők fülön / Button on the Controls tab
button({hu: "Újraindítás", en: "Restart"}, reset);

const L = 8;          // a lejtő hossza / length of the slope [m]
let s = 0.4, v = 0, a = 0;

// Fizika: sok kis lépésben fut, dt a lépés hossza (s) / Physics: runs in many small steps, dt is the step length (s)
update(dt => {
  const al = deg(P.alpha);
  // Erők: lejtő irányú, nyomóerő, súrlódás / forces: along the slope, normal, friction
  const Fp = P.m * P.g * sin(al), Fn = P.m * P.g * cos(al), Fs = P.mu * Fn;
  // Mozog, ha már csúszik, vagy ha tg α > μ / it moves if already sliding or if tan α > μ
  if (v > 1e-9 || Fp > Fs) a = (Fp - Fs) / P.m; else a = 0;
  v += a * dt;
  if (v < 0) { v = 0; a = 0; }
  s += v * dt;
  if (s > L - 0.4) { s = L - 0.4; v = 0; a = 0; }
});

// Rajzolás minden képkockán (szünetben is) / Drawing on every frame (also while paused)
draw(t => {
  const al = deg(P.alpha);
  // A lejtő mérete úgy, hogy elférjen a vásznon / slope size so that it fits on the canvas
  const Lpx = min(760 / max(cos(al), 0.01), 400 / max(sin(al), 0.01));
  const Bx = 120, By = 500;                                  // alsó csúcs / bottom vertex
  const Tx = Bx + Lpx * cos(al), Ty = By - Lpx * sin(al);    // felső csúcs / top vertex
  ground(By, {x1: 40, x2: 960});
  polygon([[Bx, By], [Tx, Ty], [Tx, By]], {fill: "#e6eaf0", stroke: C.gray, lw: 2});
  arc(Bx, By, 64, -al, 0, {stroke: C.ink, lw: 1.5});
  text("α", Bx + 84 * cos(al / 2), By - 84 * sin(al / 2) + 6, {size: 18, italic: true, align: "center"});

  // A test helyzete / block position (s a csúcstól / s measured from the top)
  const ux = -cos(al), uy = sin(al);          // lejtőn lefelé / down the slope
  const nx = -sin(al), ny = -cos(al);         // a felületre merőleges / surface normal
  const px = Tx + ux * (s / L) * Lpx, py = Ty + uy * (s / L) * Lpx;
  const bw = 70, bh = 44;
  const cxb = px + nx * bh / 2, cyb = py + ny * bh / 2;
  box(cxb, cyb, bw, bh, -al, {fill: C.blue, stroke: "#173b8f", lw: 1.5});
  text(fmt(P.m, 1) + " kg", cxb, cyb + 5, {size: 13, color: "#fff", align: "center", bold: true});

  // Erők (mg mindig 110 px) / forces (mg is always drawn 110 px long)
  const Fg = P.m * P.g, Fp = Fg * sin(al), Fn = Fg * cos(al);
  const Ff = v > 1e-9 ? P.mu * Fn : min(Fp, P.mu * Fn);
  const k = 110 / Fg;
  vector(cxb, cyb, 0, Fg * k, {stroke: C.red, lw: 3}, "mg");
  vector(cxb, cyb, nx * Fn * k, ny * Fn * k, {stroke: C.blue, lw: 3}, "N");
  if (Ff > 1e-6) vector(cxb, cyb, -ux * Ff * k, -uy * Ff * k, {stroke: C.orange, lw: 3}, "Fs");
  if (P.comp) {
    vector(cxb, cyb, ux * Fp * k, uy * Fp * k, {stroke: C.red, lw: 1.8, dash: [5, 4]}, "mg·sin α");
    vector(cxb, cyb, -nx * Fn * k, -ny * Fn * k, {stroke: C.red, lw: 1.8, dash: [5, 4]}, "mg·cos α");
  }

  const slides = tan(al) > P.mu;
  // Mért értékek a Vezérlők fülön / Readouts on the Controls tab
  show({hu: "Gyorsulás a", en: "Acceleration a"}, a, "m/s²");
  show({hu: "Sebesség v", en: "Speed v"}, v, "m/s");
  show({hu: "Megtett út s", en: "Distance s"}, s - 0.4, "m");
  show({hu: "Lejtő irányú erő mg·sin α", en: "Along-slope force mg·sin α"}, Fp, "N");
  show({hu: "Nyomóerő N = mg·cos α", en: "Normal force N = mg·cos α"}, Fn, "N");
  show({hu: "Súrlódási erő", en: "Friction force"}, Ff, "N");
  show({hu: "tg α", en: "tan α"}, tan(al), "");
  show({hu: "Állapot", en: "State"}, tr(v > 1e-9 ? {hu: "csúszik", en: "sliding"} : slides ? {hu: "indul", en: "starting"} : {hu: "nyugalomban (tg α ≤ μ)", en: "at rest (tan α ≤ μ)"}), "");

  // Élő grafikonok a vászon alatt / Live charts under the canvas
  plot({hu: "Sebesség v", en: "Speed v"}, v, {unit: "m/s", color: C.blue});
  plot({hu: "Megtett út s", en: "Distance s"}, s - 0.4, {unit: "m", color: C.green});
});
</script>

<script type="text/plain" id="preset-collision" data-app>// Egyenes ütközés – lendület- és energiamérleg
// Head-on collision – momentum and energy balance
//   m₁v₁ + m₂v₂ = m₁v₁' + m₂v₂'      e = (v₂' − v₁') / (v₁ − v₂)

// Vászon: szélesség, magasság (px), háttérszín / Canvas: width, height (px), background colour
stage(1000, 600, "#f8f9fb");
// Felirat a vászon bal felső sarkában / Caption in the top-left corner
title({hu: "Ütközés", en: "Collision"});
// A grafikon időablaka másodpercben / Chart time window in seconds
plotWindow(6);

// Csúszkák: azonosító, felirat (HU/EN), min, max, alapérték, lépés, egység – értékük: P.azonosító / Sliders: id, label (HU/EN), min, max, default, step, unit – value: P.id
param("m1", {hu: "Tömeg m₁", en: "Mass m₁"}, 0.5, 5, 1, 0.1, "kg");
param("m2", {hu: "Tömeg m₂", en: "Mass m₂"}, 0.5, 5, 2, 0.1, "kg");
param("v1", {hu: "Kezdősebesség v₁", en: "Initial velocity v₁"}, -4, 4, 3, 0.1, "m/s");
param("v2", {hu: "Kezdősebesség v₂", en: "Initial velocity v₂"}, -4, 4, -1, 0.1, "m/s");
param("e",  {hu: "Ütközési szám e (1 = rugalmas)", en: "Restitution e (1 = elastic)"}, 0, 1, 1, 0.05, "");
// Ezek változásakor a jelenet újraindul / The scene restarts when these change
resetOn("m1", "m2", "v1", "v2", "e");
// Gomb a Vezérlők fülön / Button on the Controls tab
button({hu: "Újraindítás", en: "Restart"}, reset);

// Fizikai világ: méterben, y felfelé; scale = px/m / Physics world: metres, y up; scale = px per metre
const W = world({gravity: 0, scale: 80, origin: [60, 230], ground: false, restitution: P.e});
// A golyó sugara a tömeg köbgyökével arányos / ball radius ∝ cube root of mass
const rad = m => 0.22 * cbrt(m);
const b1 = ball({x: 3, y: 0, vx: P.v1, m: P.m1, r: rad(P.m1), color: C.blue, label: "1"});
const b2 = ball({x: 7.5, y: 0, vx: P.v2, m: P.m2, r: rad(P.m2), color: C.orange, label: "2"});

// Vízszintes oszlop egy értékhez / horizontal bar for one value
function bar(label, value, y, color, sc) {
  const x0 = 520, w = clamp(value * sc, -400, 400);
  rect(min(x0, x0 + w), y, abs(w), 18, {fill: color});
  text(label, 170, y + 14, {size: 14});
  text(fmt(value, 2), 960, y + 14, {size: 13, align: "right", font: "IBM Plex Mono, monospace"});
}

// Rajzolás minden képkockán (szünetben is) / Drawing on every frame (also while paused)
draw(t => {
  const y0 = wy(0);
  line(20, y0, 980, y0, {stroke: "#c9d0da", lw: 2, dash: [8, 8]});
  line(wx(0), y0 + 70, wx(11), y0 + 70, {stroke: C.gray, lw: 1});
  for (let x = 0; x <= 11; x++) {
    line(wx(x), y0 + 70, wx(x), y0 + 78, {stroke: C.gray, lw: 1});
    text(x + " m", wx(x), y0 + 94, {size: 11, color: C.gray, align: "center"});
  }
  // A fizikai világ (golyók, talaj) kirajzolása / Draw the physics world (balls, ground)
  drawWorld();
  for (const [bb, lab] of [[b1, "v₁"], [b2, "v₂"]]) {
    if (abs(bb.vx) > 0.02) vector(wx(bb.x), y0 - ws(bb.r) - 20, bb.vx * 40, 0, {stroke: bb.color, lw: 3}, lab);
  }

  const p1 = P.m1 * b1.vx, p2 = P.m2 * b2.vx;
  const E1 = 0.5 * P.m1 * b1.vx ** 2, E2 = 0.5 * P.m2 * b2.vx ** 2;
  line(520, 380, 520, 590, {stroke: C.gray, lw: 1});
  text({hu: "Lendület p [kg·m/s]", en: "Momentum p [kg·m/s]"}, 170, 392, {size: 13, color: C.gray, bold: true});
  bar("p₁", p1, 402, C.blue, 18);
  bar("p₂", p2, 426, C.orange, 18);
  bar("Σp", p1 + p2, 450, C.ink, 18);
  text({hu: "Mozgási energia E [J]", en: "Kinetic energy E [J]"}, 170, 500, {size: 13, color: C.gray, bold: true});
  bar("E₁", E1, 510, C.blue, 8);
  bar("E₂", E2, 534, C.orange, 8);
  bar("ΣE", E1 + E2, 558, C.ink, 8);

  const M = P.m1 + P.m2, pt = P.m1 * P.v1 + P.m2 * P.v2;
  // Mért értékek a Vezérlők fülön / Readouts on the Controls tab
  show({hu: "Teljes lendület Σp", en: "Total momentum Σp"}, p1 + p2, "kg·m/s");
  show({hu: "Teljes mozgási energia ΣE", en: "Total kinetic energy ΣE"}, E1 + E2, "J");
  show({hu: "v₁ most", en: "v₁ now"}, b1.vx, "m/s");
  show({hu: "v₂ most", en: "v₂ now"}, b2.vx, "m/s");
  if (P.v1 > P.v2) {
    show({hu: "v₁' (elmélet)", en: "v₁' (theory)"}, (pt - P.m2 * P.e * (P.v1 - P.v2)) / M, "m/s");
    show({hu: "v₂' (elmélet)", en: "v₂' (theory)"}, (pt + P.m1 * P.e * (P.v1 - P.v2)) / M, "m/s");
  } else {
    show({hu: "Ütközés", en: "Collision"}, tr({hu: "nem lesz (v₁ ≤ v₂)", en: "none (v₁ ≤ v₂)"}), "");
  }

  // Élő grafikonok a vászon alatt / Live charts under the canvas
  plot("v₁", b1.vx, {unit: "m/s", color: C.blue});
  plot("v₂", b2.vx, {unit: "m/s", color: C.orange});
  plot("ΣE", E1 + E2, {unit: "J", color: C.ink, min: 0});
});
</script>

<script type="text/plain" id="preset-pendulum" data-app>// Matematikai inga – pontos megoldás és kis kitérésű közelítés
// Simple pendulum – exact motion vs. small-angle approximation
//   θ'' = −(g/L)·sin θ − c·θ'        T₀ = 2π·√(L/g)

// Vászon: szélesség, magasság (px), háttérszín / Canvas: width, height (px), background colour
stage(1000, 600, "#f8f9fb");
// Felirat a vászon bal felső sarkában / Caption in the top-left corner
title({hu: "Matematikai inga", en: "Simple pendulum"});

// Csúszkák: azonosító, felirat (HU/EN), min, max, alapérték, lépés, egység – értékük: P.azonosító / Sliders: id, label (HU/EN), min, max, default, step, unit – value: P.id
param("L",   {hu: "Fonálhossz L", en: "Length L"}, 0.2, 3, 1.5, 0.05, "m");
param("th0", {hu: "Kezdeti kitérés θ₀", en: "Initial angle θ₀"}, 5, 170, 30, 1, "°");
param("g",   {hu: "Nehézségi gyorsulás g", en: "Gravity g"}, 1, 25, 9.81, 0.01, "m/s²");
param("c",   {hu: "Csillapítás c", en: "Damping c"}, 0, 1, 0, 0.01, "1/s");
// Kapcsolók: értékük true / false / Switches: their value is true / false
toggle("ghost", {hu: "Kis kitérésű közelítés (szürke)", en: "Small-angle approximation (grey)"}, true);
toggle("vec",   {hu: "Erővektorok", en: "Force vectors"}, true);
// Ezek változásakor a jelenet újraindul / The scene restarts when these change
resetOn("L", "th0");

let th = deg(P.th0), w = 0, lastCross = null, Tm = null, prev = th;

// Fizika: sok kis lépésben fut, dt a lépés hossza (s) / Physics: runs in many small steps, dt is the step length (s)
update((dt, t) => {
  // Mozgásegyenlet: θ'' = −(g/L)·sin θ − c·θ' / equation of motion
  w += (-P.g / P.L * sin(th) - P.c * w) * dt;
  th += w * dt;
  // Nullátmenet → mért lengésidő / zero crossing → measured period
  if (prev < 0 && th >= 0) { if (lastCross !== null) Tm = t - lastCross; lastCross = t; }
  prev = th;
});

// Rajzolás minden képkockán (szünetben is) / Drawing on every frame (also while paused)
draw(t => {
  const px = 500, py = 70, sc = 150;   // felfüggesztés, px/m / pivot, px per metre
  rect(px - 90, py - 16, 180, 16, {fill: "#d7dde6"});
  for (let x = px - 86; x < px + 90; x += 12) line(x, py - 16, x + 8, py - 26, {stroke: C.gray, lw: 1});
  line(px, py, px, py + P.L * sc + 40, {stroke: C.gray, lw: 1, dash: [4, 6]});

  // Közelítés: θ₀·cos(√(g/L)·t) – kis kitérésre pontos / approximation, exact for small angles
  if (P.ghost) {
    const tg = deg(P.th0) * cos(sqrt(P.g / P.L) * t) * exp(-P.c * t / 2);
    const gx = px + P.L * sc * sin(tg), gy = py + P.L * sc * cos(tg);
    line(px, py, gx, gy, {stroke: C.gray, lw: 1.5, alpha: 0.5});
    circle(gx, gy, 20, {fill: C.gray, alpha: 0.35, stroke: false});
  }

  const bx = px + P.L * sc * sin(th), by = py + P.L * sc * cos(th);
  line(px, py, bx, by, {stroke: C.ink, lw: 2});
  arc(px, py, 56, PI / 2 - max(th, 0), PI / 2 - min(th, 0), {stroke: C.ink, lw: 1.2});
  circle(px, py, 5, {fill: C.ink});
  circle(bx, by, 20, {fill: C.blue, stroke: "#173b8f", lw: 1.5});

  if (P.vec) {
    const F = 90;   // mg = 90 px
    vector(bx, by, 0, F, {stroke: C.red, lw: 3}, "mg");
    const ft = -sin(th) * F;   // visszatérítő összetevő / restoring component
    vector(bx, by, cos(th) * ft, -sin(th) * ft, {stroke: C.orange, lw: 2.5}, "mg·sin θ");
    vector(bx, by, cos(th) * w * 30, -sin(th) * w * 30, {stroke: C.green, lw: 2}, "v");
  }

  const T0 = 2 * PI * sqrt(P.L / P.g);
  // Mért értékek a Vezérlők fülön / Readouts on the Controls tab
  show({hu: "Kitérés θ", en: "Angle θ"}, todeg(th), "°");
  show({hu: "Szögsebesség ω", en: "Angular velocity ω"}, w, "rad/s");
  show({hu: "Lengésidő T₀ = 2π√(L/g)", en: "Period T₀ = 2π√(L/g)"}, T0, "s");
  show({hu: "Mért lengésidő", en: "Measured period"}, Tm === null ? "…" : Tm, "s");
  show({hu: "Sebesség v = L·ω", en: "Speed v = L·ω"}, abs(P.L * w), "m/s");

  // Élő grafikonok a vászon alatt / Live charts under the canvas
  plot({hu: "Kitérés θ", en: "Angle θ"}, todeg(th), {unit: "°", color: C.blue});
  plot({hu: "Szögsebesség ω", en: "Angular velocity ω"}, w, {unit: "rad/s", color: C.green});
});

<script type="text/plain" id="preset-template" data-app>// ===== AnimLab sablon / template =====
// A szkript felülről egyszer fut le (és minden újraindításkor).
// The script runs once from the top (and again on every reset).
//   param / toggle / button   → csúszkák, kapcsolók / sliders, switches  (értékük: P.név / value: P.name)
//   update(dt => { ... })     → fizika kis lépésekben (dt ≤ 1/240 s) / physics in small steps (dt ≤ 1/240 s)
//   draw(t => { ... })        → rajzolás minden képkockán / drawing on every frame
// Képernyő: x jobbra, y lefelé, képpontban / screen: x right, y down, in pixels.
// Képek: Képek fül → feltöltés → image("név", x, y) / Images tab → upload → image("name", x, y)

// Vászon: szélesség, magasság (px), háttérszín / Canvas: width, height (px), background colour
stage(1000, 600, "#fbfbf8");
// Felirat a vászon bal felső sarkában / Caption in the top-left corner
title({hu: "Saját jelenet", en: "My scene"});

// Csúszkák: azonosító, felirat (HU/EN), min, max, alapérték, lépés, egység – értékük: P.azonosító / Sliders: id, label (HU/EN), min, max, default, step, unit – value: P.id
param("speed", {hu: "Forgási sebesség", en: "Rotation speed"}, 0, 360, 90, 1, "°/s");
param("grav",  {hu: "Gravitáció", en: "Gravity"}, 0, 20, 9.81, 0.01, "m/s²");
// Gomb a Vezérlők fülön / Button on the Controls tab
button({hu: "Labdák újra", en: "Drop the balls again"}, reset);

// Fizikai világ: méterben, y felfelé / physics world: metres, y up
const W = world({gravity: P.grav, scale: 50, origin: [40, 560], ground: true, walls: true, restitution: 0.75});
for (let i = 0; i < 5; i++) {
  ball({x: 9 + i * 1.6, y: 4 + i * 0.8, vx: -1 + i * 0.5, r: 0.3 + 0.05 * i, color: C.list[i], trail: 40});
}

let angle = 0;
// Fizika: sok kis lépésben fut, dt a lépés hossza (s) / Physics: runs in many small steps, dt is the step length (s)
update(dt => {
  angle += deg(P.speed) * dt;
  W.g = P.grav;
});

// Rajzolás minden képkockán (szünetben is) / Drawing on every frame (also while paused)
draw(t => {
  grid(50);
  text({hu: "Alapalakzatok", en: "Basic shapes"}, 40, 84, {size: 14, color: C.gray});
  circle(90, 150, 40, {fill: C.blue});
  rect(160, 110, 90, 80, {fill: C.green, radius: 8});
  box(330, 150, 110, 46, angle, {fill: C.orange});
  arrow(420, 180, 520, 120, {stroke: C.red, lw: 3});
  polygon([[560, 190], [610, 110], [660, 190]], {fill: C.purple, alpha: 0.85});
  const xe = 830 + 40 * sin(t * 4);
  spring(700, 150, xe, 150, {coils: 9});
  circle(xe, 150, 16, {fill: C.ink});

  text({hu: "Kép: tölts fel egyet „kep” néven", en: "Image: upload one named “kep”"}, 200, 300, {size: 14, color: C.gray, align: "center"});
  image("kep", 200, 410, {w: 140, angle: angle});

  // A fizikai világ (golyók, talaj) kirajzolása / Draw the physics world (balls, ground)
  drawWorld();

  const b0 = W.bodies[0];
  // Mért értékek a Vezérlők fülön / Readouts on the Controls tab
  show({hu: "1. labda magassága", en: "Ball 1 height"}, b0.y - b0.r, "m");
  show({hu: "Szög", en: "Angle"}, todeg(angle) % 360, "°");
  // Élő grafikonok a vászon alatt / Live charts under the canvas
  plot({hu: "1. labda magassága", en: "Ball 1 height"}, b0.y - b0.r, {unit: "m", color: C.blue, min: 0});
});
</script>

function marksCode() {
  const top = [];

  for (const m of scene.marks) if (m.type === 'arrow') {
    let id; do { id = (LANG === 'hu' ? 'nyíl ' : 'arrow ') + n++; } while (used.has(id));
    used.add(id); top.push(arrowDecl(m, id));
  }
  const others = scene.marks.filter(m => m.type !== 'arrow');
  if (!others.length) return '// ' + (LANG === 'hu' ? 'Jelölők (a Jelölők fülön is szerkeszthetők)' : 'Markup (also editable on the Markup tab)') + '\n' + top.join('\n');
  const L = ['// ' + (LANG === 'hu' ? 'Jelölők' : 'Markup')].concat(top, ['draw(t => {']);
  const keys = valKeys();
  if (keys.length) L.push(`  const {${keys.join(', ')}} = vals();   // val(...) ${LANG === 'hu' ? 'értékek' : 'values'}`);
  const sp = (m) => m.flowExpr && String(m.flowExpr).trim() ? `${m.flow || 0} * (${m.flowExpr})` : `${m.flow || 0}`;
  for (const m of others) {
    const col = JSON.stringify(m.color || '#d64045');
