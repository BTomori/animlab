<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnimLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* layout: stage, transport and live plots on the left; tabbed panel (controls / code / images / help) on the right */
  --bg: #e8ecf1;
  --panel: #ffffff;
  --ink: #17202c;
  --muted: #5a6575;
  --line: #d2d9e2;
  --accent: #1f47c4;
  --accent-ink: #ffffff;
  --accent-soft: #e5ebfb;
  --rec: #cf3434;
  --code-bg: #f5f7fa;
  --plot-bg: #f3f5f8;
  --font-display: "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131a; --panel: #171d26; --ink: #e5e9ef; --muted: #96a1b2; --line: #2a3340;
    --accent: #7d98ff; --accent-ink: #0b1020; --accent-soft: #1f2a48; --rec: #ff6a6a;
    --code-bg: #11161e; --plot-bg: #121821; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131a; --panel: #171d26; --ink: #e5e9ef; --muted: #96a1b2; --line: #2a3340;
  --accent: #7d98ff; --accent-ink: #0b1020; --accent-soft: #1f2a48; --rec: #ff6a6a;
  --code-bg: #11161e; --plot-bg: #121821; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-body);
  display: grid; grid-template-rows: auto minmax(0, 1fr);
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }

/* top bar */
.topbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
  padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font: 600 19px/1 var(--font-display); letter-spacing: .01em; margin-right: 4px; }
.brand svg { width: 26px; height: 26px; }
.scene-name {
  min-width: 0; width: 220px; height: 34px; padding: 0 10px; border: 1px solid var(--line);
  border-radius: 7px; background: var(--code-bg);
}
.tb-group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.spacer { flex: 1; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 7px;
  background: var(--panel); cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.icon { width: 36px; padding: 0; }
.btn svg { width: 18px; height: 18px; }
select.btn { padding-right: 8px; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.lang button { height: 32px; padding: 0 10px; border: 0; background: transparent; cursor: pointer; font-weight: 600; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.menu { position: relative; }
.menu-pop {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 250px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 6px;
  box-shadow: 0 10px 30px rgba(10, 20, 40, .18); display: grid; gap: 2px;
}
.menu-pop[hidden] { display: none; }
.menu-pop button {
  text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 6px; cursor: pointer;
  display: grid; gap: 1px;
}
.menu-pop button:hover { background: var(--accent-soft); }
.menu-pop small { color: var(--muted); font-size: 12px; }

/* main layout */
.layout {
  display: grid; grid-template-columns: minmax(0, 1fr) 12px var(--side-w, 400px); gap: 2px; padding: 12px;
  min-height: 0;
}
.splitter { cursor: col-resize; position: relative; touch-action: none; border-radius: 6px; }
.splitter::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 48px; transform: translate(-50%, -50%);
  border-radius: 3px; background: var(--line);
}
.splitter:hover::after, .splitter:focus-visible::after, .splitter.drag::after { background: var(--accent); }
body.resizing { cursor: col-resize; user-select: none; }
.stage-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; }
.stage-wrap {
  position: relative; display: flex; justify-content: center; background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
}
#stage { display: block; touch-action: none; }
.stage-err {
  position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 10px 12px; border-radius: 8px;
  background: #fff1f1; color: #8f1d1d; border: 1px solid #f1b9b9; font-size: 13px; cursor: pointer;
}
.rec-badge {
  position: absolute; top: 10px; right: 10px; padding: 4px 10px; border-radius: 99px; cursor: pointer;
  background: var(--rec); color: #fff; font: 600 12px/1.4 var(--font-mono); border: 0;
}
.transport { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.time { font: 500 14px var(--font-mono); font-variant-numeric: tabular-nums; min-width: 112px; padding: 0 6px; }
.speed { display: flex; align-items: center; gap: 8px; margin-left: auto; color: var(--muted); }
.speed input { width: 160px; accent-color: var(--accent); }
.speed output { font: 500 13px var(--font-mono); color: var(--ink); min-width: 54px; font-variant-numeric: tabular-nums; }
.plots { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 4px; }
#plot { display: block; width: 100%; }

/* side panel */
.side {
  display: flex; flex-direction: column; min-height: 0; background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
}
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button {
  flex: 1; height: 42px; border: 0; background: transparent; cursor: pointer; font-weight: 500;
  color: var(--muted); border-bottom: 2px solid transparent;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab-panel { flex: 1; min-height: 0; overflow: auto; padding: 12px 14px; }
.tab-panel[hidden] { display: none; }
#tab-code { display: flex; flex-direction: column; gap: 8px; }
#tab-code[hidden] { display: none; }
.panel-h { font: 600 13px var(--font-display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; }
.panel-h:first-child { margin-top: 0; }

.ctl { display: block; padding: 9px 0; border-bottom: 1px solid var(--line); }
.ctl-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.ctl-head label { font-weight: 500; }
.ctl-num { display: inline-flex; align-items: center; gap: 4px; }
.ctl-num input {
  width: 84px; height: 28px; padding: 0 6px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--code-bg); text-align: right; font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums;
}
.unit { color: var(--muted); font-size: 12px; min-width: 34px; }
.ctl input[type="range"] { width: 100%; accent-color: var(--accent); margin: 2px 0 0; }
.ctl-toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.ctl-toggle input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.ctl select { width: 100%; height: 32px; border: 1px solid var(--line); border-radius: 6px; background: var(--code-bg); }
.ctl-buttons { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 8px; }
.link-btn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 8px 0; font-size: 13px; }

.ro { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
.ro-l { color: var(--muted); }
.ro-v { font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.ro-u { color: var(--muted); margin-left: 5px; }

.code-bar { display: flex; align-items: center; gap: 10px; }
.code-state { color: var(--muted); font-size: 12px; }
.code-state.dirty { color: #b5651d; }
.editor {
  position: relative; flex: 1; min-height: 360px; display: flex; border: 1px solid var(--line);
  border-radius: 8px; background: var(--code-bg); overflow: hidden;
}
.gutter {
  margin: 0; padding: 10px 6px 10px 8px; text-align: right; color: var(--muted); opacity: .7;
  font: 12.5px/1.55 var(--font-mono); user-select: none; overflow: hidden; min-width: 38px;
  border-right: 1px solid var(--line);
}
#code {
  flex: 1; border: 0; resize: none; padding: 10px; background: transparent; outline: none;
  font: 12.5px/1.55 var(--font-mono); white-space: pre; overflow: auto; tab-size: 2;
}
.code-err.warn { background: #fff8e1; color: #7a5200; border-color: #f0d48a; }
.code-err {
  margin: 0; padding: 8px 10px; border-radius: 7px; background: #fff1f1; color: #8f1d1d;
  border: 1px solid #f1b9b9; font: 12px/1.45 var(--font-mono); white-space: pre-wrap; cursor: pointer;
}

.drop {
  display: grid; place-items: center; gap: 2px; padding: 18px; border: 1.5px dashed var(--line);
  border-radius: 10px; cursor: pointer; text-align: center;
}
.drop:hover { border-color: var(--accent); }
.drop b { font-weight: 600; }
.asset { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.asset img {
  width: 64px; height: 64px; object-fit: contain; border-radius: 6px; border: 1px solid var(--line);
  background: repeating-conic-gradient(#e7eaee 0 25%, #fff 0 50%) 50% / 12px 12px;
}
.asset input { width: 100%; height: 28px; padding: 0 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--code-bg); font: 500 13px var(--font-mono); }
.asset code { display: block; font: 12px var(--font-mono); color: var(--muted); margin: 4px 0; overflow-wrap: anywhere; }
.asset .row { display: flex; gap: 6px; }
.asset-err { margin: 2px 0 6px; font-size: 12px; color: #c0392b; }
.asset .btn { height: 28px; font-size: 12px; padding: 0 9px; }

.help h3 { font: 600 18px var(--font-display); margin: 18px 0 6px; text-wrap: balance; }
.help h3:first-of-type { margin-top: 4px; }
.help-nav { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.help-nav .link-btn { padding: 0; }
.lesson { padding: 10px 0 14px; border-bottom: 1px solid var(--line); }
.lesson h4 { display: flex; align-items: center; gap: 8px; margin: 6px 0 4px; }
.lesson .num {
  display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink); font: 600 12px var(--font-body);
}
.help pre {
  margin: 8px 0; padding: 10px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 7px;
  font: 12px/1.5 var(--font-mono); overflow-x: auto; white-space: pre;
}
.lesson-btns { display: flex; gap: 6px; }
.lesson-btns .btn { height: 30px; font-size: 13px; }
.tips { margin: 6px 0; padding-left: 18px; }
.tips li { margin: 4px 0; }
.help h4 { font: 600 15px var(--font-display); margin: 16px 0 6px; }
.help p { margin: 6px 0; }
.help dl { margin: 0; }
.help dt { margin-top: 8px; }
.help dd { margin: 2px 0 0 0; color: var(--muted); }
.help code { font: 12.5px var(--font-mono); background: var(--code-bg); padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
.help kbd { font: 12px var(--font-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }

.tools { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.tools .btn { height: 32px; font-size: 13px; padding: 0 10px; }
.tools .btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tool-hint { margin: 4px 0; font-size: 13px; color: var(--accent); min-height: 1.4em; }
.coord { font: 500 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; margin-bottom: 6px; }
.mark { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 8px 0; display: grid; gap: 6px; }
.mark-h { display: flex; align-items: center; gap: 8px; }
.mark-h b { flex: 1; font-weight: 600; }
.mark-h .x { border: 0; background: none; cursor: pointer; font-size: 18px; color: var(--muted); padding: 0 4px; }
.swatches { display: flex; gap: 4px; }
.swatches button { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(0,0,0,.25); cursor: pointer; padding: 0; }
.swatches button[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.mark-f { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px 8px; }
.mark-f label { display: grid; gap: 2px; font-size: 11.5px; color: var(--muted); }
.mark-f input, .mark-f select {
  height: 28px; padding: 0 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--code-bg); font-size: 13px; width: 100%;
}
.mark-f .btn { height: 28px; font-size: 12px; align-self: end; }
.mark-f .wide { grid-column: 1 / -1; }
.mark-f input[type=color] { padding: 2px; height: 28px; cursor: pointer; }
details.bind summary { cursor: pointer; font-size: 12px; color: var(--accent); padding: 2px 0; }
details.bind .mark-f { margin-top: 6px; }
.cm { contain: layout; }
.cm .now { margin: 0; font: 12px/1.5 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.cm .now i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; border: 1px solid rgba(0,0,0,.25); }
.bound-empty code { font: 12px var(--font-mono); background: var(--code-bg); padding: 1px 4px; border-radius: 4px; }
.mark-f input.bad { border-color: #d64045; background: #fff1f1; }
.codemarks { margin: 14px 0 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.codemarks summary { cursor: pointer; font: 600 13px var(--font-display); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.cm { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin: 6px 0; display: grid; gap: 6px; }
.cm.on { border-color: #e6b422; box-shadow: 0 0 0 2px rgba(230, 180, 34, .25); }
.cm-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cm-h label { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 120px; cursor: pointer; }
.cm-h input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
.cm-h .kind { color: var(--muted); font-size: 12px; }
.cm-h .rs { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 12px; padding: 0 2px; }
.vars { margin: 2px 0 8px; font: 12px/1.5 var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
#stage.tool-on { cursor: crosshair; }
.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 50; max-width: calc(100% - 32px);
  display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 9px;
  background: #1c2533; color: #f1f4f8; box-shadow: 0 10px 30px rgba(0,0,0,.25);
}
.toast button { border: 0; background: transparent; color: #9fb4ff; font-weight: 600; cursor: pointer; }
.toast[hidden] { display: none; }

.stage-col:fullscreen { background: var(--bg); padding: 12px; }

@media (max-width: 900px) {
  body { display: block; height: auto; }
  .layout { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .splitter { display: none; }
  .side { min-height: 520px; }
  .scene-name { width: 100%; order: 10; }
  .speed { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand" aria-label="AnimLab">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1.5" y="1.5" width="29" height="29" rx="7" fill="var(--accent)"/><circle cx="16" cy="16" r="8" fill="none" stroke="var(--accent-ink)" stroke-width="2"/><path d="M10.3 21.7 21.7 10.3" stroke="var(--accent-ink)" stroke-width="2.6" stroke-linecap="round"/><circle cx="21.7" cy="10.3" r="2.6" fill="var(--accent-ink)"/></svg>
    AnimLab
  </div>
  <input id="sceneName" class="scene-name" data-i18n-ph="sceneName" data-i18n-title="sceneName">
  <select id="presetSel" class="btn" data-i18n-title="presets"></select>
  <div class="tb-group">
    <button class="btn" id="btnNew" type="button" data-i18n="new"></button>
    <button class="btn" id="btnOpen" type="button" data-i18n="open"></button>
    <button class="btn primary" id="btnSave" type="button" data-i18n="save"></button>
    <div class="menu">
      <button class="btn" id="btnExport" type="button" aria-haspopup="true" aria-expanded="false"><span data-i18n="export"></span> ▾</button>
      <div class="menu-pop" id="exportMenu" hidden>
        <button type="button" id="exVideo"><span id="exVideoLbl"></span><small data-i18n="exVideoSub"></small></button>
        <button type="button" id="exPng"><span data-i18n="exPng"></span><small data-i18n="exPngSub"></small></button>
        <button type="button" id="exHtml"><span data-i18n="exHtml"></span><small data-i18n="exHtmlSub"></small></button>
      </div>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="hu">HU</button>
    <button type="button" data-lang="en">EN</button>
  </div>
  <input type="file" id="fileOpen" accept=".json,application/json" hidden>
</header>

<main class="layout">
  <section class="stage-col" id="stageCol">
    <div class="stage-wrap" id="stageWrap">
      <canvas id="stage"></canvas>
      <button class="rec-badge" id="recBadge" type="button" hidden>● REC</button>
      <div class="stage-err" id="stageErr" hidden></div>
    </div>
    <div class="transport">
      <button class="btn icon" id="btPlay" type="button" data-i18n-title="play"></button>
      <button class="btn icon" id="btStep" type="button" data-i18n-title="step"><svg viewBox="0 0 24 24"><path d="M6 5v14l9-7z" fill="currentColor"/><rect x="16" y="5" width="2.6" height="14" fill="currentColor"/></svg></button>
      <button class="btn icon" id="btReset" type="button" data-i18n-title="resetT"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></button>
      <button class="btn icon" id="btFull" type="button" data-i18n-title="full"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <span class="time" id="timeLbl">t = 0.00 s</span>
      <label class="speed" for="speed"><span data-i18n="speed"></span>
        <input type="range" id="speed" min="-10" max="1" step="0.01" value="0">
        <output id="speedOut">1×</output>
      </label>
    </div>
    <div class="plots" id="plotsWrap" hidden><canvas id="plot"></canvas></div>
  </section>

  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-title="splitter"></div>

  <aside class="side">
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="controls" data-i18n="tabControls"></button>
      <button type="button" role="tab" data-tab="code" data-i18n="tabCode"></button>
      <button type="button" role="tab" data-tab="assets" data-i18n="tabAssets"></button>
      <button type="button" role="tab" data-tab="marks" data-i18n="tabMarks"></button>
      <button type="button" role="tab" data-tab="help" data-i18n="tabHelp"></button>
    </nav>
    <div class="tab-panel" id="tab-controls" role="tabpanel">
      <div class="panel-h" data-i18n="params"></div>
      <div id="controls"></div>
      <div class="panel-h" data-i18n="readouts"></div>
      <div id="readouts"></div>
    </div>
    <div class="tab-panel" id="tab-code" role="tabpanel" hidden>
      <div class="code-bar">
        <button class="btn primary" id="btRun" type="button"><svg viewBox="0 0 24 24"><path d="M7 5v14l11-7z" fill="currentColor"/></svg><span data-i18n="run"></span></button>
        <span class="code-state" id="codeState"></span>
      </div>
      <div class="editor">
        <pre class="gutter" id="gutter" aria-hidden="true">1</pre>
        <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" data-i18n-title="tabCode"></textarea>
      </div>
      <pre class="code-err" id="codeErr" hidden></pre>
    </div>
    <div class="tab-panel" id="tab-assets" role="tabpanel" hidden>

<script type="text/plain" id="preset-motor" data-app>// Egyenáramú (DC) motor – egy tekercs, kétszegmenses kommutátor
// DC motor – single coil, two-segment commutator
//   k = N·B·A      e = k·ω·|cos θ|      I = (U − e) / R
//   M = k·I·|cos θ|      J·dω/dt = M − M_terh − b·ω

// Vászon: szélesség, magasság (px), háttérszín / Canvas: width, height (px), background colour
stage(1000, 600, "#fbfbf8");
// Felirat a vászon bal felső sarkában / Caption in the top-left corner
title({hu: "Egyenáramú motor", en: "DC motor"});
timeScale(0.1);   // induláskor 10× lassítás / start in 10× slow motion
plotWindow(2);    // a grafikon 2 s-ot mutat / plots show 2 s

// Csúszkák: azonosító, felirat (HU/EN), min, max, alapérték, lépés, egység – értékük: P.azonosító / Sliders: id, label (HU/EN), min, max, default, step, unit – value: P.id
param("U",  {hu: "Tápfeszültség U", en: "Supply voltage U"}, -24, 24, 12, 0.5, "V");
param("N",  {hu: "Menetszám N", en: "Number of turns N"}, 1, 300, 100, 1, "");
param("B",  {hu: "Mágneses indukció B", en: "Flux density B"}, 0, 1.5, 0.8, 0.01, "T");
param("A",  {hu: "Tekercs felülete A", en: "Coil area A"}, 5, 100, 40, 1, "cm²");
param("R",  {hu: "Tekercsellenállás R", en: "Winding resistance R"}, 0.5, 20, 4, 0.1, "Ω");
param("ML", {hu: "Terhelőnyomaték", en: "Load torque"}, 0, 1, 0, 0.01, "N·m");
param("J",  {hu: "Tehetetlenségi nyomaték J", en: "Moment of inertia J"}, 5, 500, 50, 1, "kg·cm²");
// Kapcsolók: értékük true / false / Switches: their value is true / false
toggle("field",  {hu: "Erővonalak", en: "Field lines"}, true);
toggle("forces", {hu: "Lorentz-erők", en: "Lorentz forces"}, true);
toggle("photo",  {hu: "Forgórész fényképe", en: "Rotor photo"}, true);   // a Képek fülön „rotor” néven / named "rotor" on the Images tab
// Gomb a Vezérlők fülön / Button on the Controls tab
button({hu: "Polaritásváltás", en: "Reverse polarity"}, () => setParam("U", -P.U));

const b = 0.0005;   // csapágysúrlódás / bearing friction [N·m·s]
let theta = 0;      // forgórész szöge / rotor angle [rad]
let omega = 0;      // szögsebesség / angular speed [rad/s]
let I = 0, e = 0, M = 0;

// Fizika: sok kis lépésben fut, dt a lépés hossza (s) / Physics: runs in many small steps, dt is the step length (s)
update(dt => {
  const k = P.N * P.B * P.A * 1e-4;   // cm² → m²
  const c = abs(cos(theta));          // kommutátor / commutator
  // Ellen-EMF, áram és nyomaték a pillanatnyi szögből / back-EMF, current and torque from the present angle
  e = k * omega * c;
  I = (P.U - e) / P.R;
  M = k * I * c;
  const J = P.J * 1e-4;               // kg·cm² → kg·m²
  let Mt = P.ML * sign(omega);
  if (abs(omega) < 1e-3 && abs(M) <= P.ML) { omega = 0; Mt = M; }   // áll / stalled
  // Mozgásegyenlet: J·dω/dt = M − M_t − b·ω / equation of motion
  omega += (M - Mt - b * omega) / J * dt;
  theta += omega * dt;
});

// Változóhoz kötött nyilak a kapcsolási rajzon – a Jelölők fülön ugyanezek a beállítások látszanak és szerkeszthetők
// Arrows bound to variables on the circuit – the Markup tab shows these same settings and can edit them
boundArrow("U-nyíl", {
  x: 785, y: 430,                                // kezdőpont (px) / start point (px)
  angle: 90,                                     // irány fokban: 90 = felfelé / direction in degrees: 90 = up
  length: "110 * sign(P.U)",                     // hossz px-ben; U < 0 esetén lefelé mutat / length in px; points down for U < 0
  width: 4,                                      // vastagság px-ben / width in px
  color: "#d64045",                              // szín / colour
  label: "U"                                     // felirat / label
});
boundArrow("e-nyíl", {
  x: 875, y: 320,                                // kezdőpont (px) / start point (px)
  angle: -90,                                    // lefelé: az ellen-EMF szemben áll U-val / down: back-EMF opposes U
  length: "110 * e / max(abs(P.U), 1)",          // e = U esetén 110 px / 110 px when e = U
  width: "2 + 3 * abs(e) / max(abs(P.U), 1)",    // vastagodik, ahogy e nő / gets thicker as e grows
  color: "#2f6fd6",                              // szín, ha e kicsi / colour while e is small
  colorBy: "abs(e) / max(abs(P.U), 1)",          // a szín ettől függ: 0 … 1 / the colour follows this: 0 … 1
  colorMin: 0, colorMax: 1,                      // a színátmenet határai / limits of the colour blend
  colorTo: "#7c5cd6",                            // szín, amikor e eléri U-t / colour when e reaches U
  label: "e"                                     // felirat / label
});

const cx = 360, cy = 320, r = 120;   // forgórész középpontja / rotor centre

// Rajzolás minden képkockán (szünetben is) / Drawing on every frame (also while paused)
draw(t => {
  // Állórész: koszorú és mágnesek / stator: yoke and magnets
  rect(62, 100, 596, 440, {stroke: "#9aa3b1", lw: 16, radius: 28});
  rect(70, 170, 120, 300, {fill: C.N, radius: 4});
  rect(530, 170, 120, 300, {fill: C.S, radius: 4});
  text("N", 130, 320, {size: 46, bold: true, color: "#fff", align: "center", baseline: "middle"});
  text("S", 590, 320, {size: 46, bold: true, color: "#fff", align: "center", baseline: "middle"});

  // Mágneses erővonalak: sűrűségük B-vel arányos / field lines: density follows B
  if (P.field && P.B > 0.001) {
    const n = round(3 + P.B / 1.5 * 9);
    for (let i = 0; i < n; i++) {
      const y = 182 + (i + 0.5) * 276 / n;
      line(190, y, 530, y, {stroke: "#8b95a5", lw: 1.2, alpha: 0.6});
      arrow(196, y, 228, y, {stroke: "#8b95a5", lw: 1.2, head: 7, id: "erővonal-nyíl"});
      arrow(492, y, 524, y, {stroke: "#8b95a5", lw: 1.2, head: 7, id: "erővonal-nyíl"});
    }
    text("B", 214, 162, {size: 19, bold: true, italic: true, color: C.gray});
  }

  // Forgórész és tekercs / rotor and coil
  if (P.photo) {
    // Fénykép: a kép közepe a tengely, a forgórész θ szögével együtt fordul (mínusz: a vászon az óramutató irányába forgat)
    // Photo: the picture's centre is the shaft, it turns with the rotor angle θ (minus: the canvas turns clockwise)
    image("rotor", cx, cy, {w: 300, angle: -theta});   // 300 px átmérő: elfér a pólusok között / 300 px across: fits between the poles
  } else {
    circle(cx, cy, r, {fill: "rgba(255,255,255,0.55)", stroke: "#c3cad5", lw: 2, dash: [6, 6]});
  }
  // A tekercs két vezetőjének helye / positions of the coil’s two conductors
  const ax = cx + r * cos(theta), ay = cy - r * sin(theta);
  const bx = cx - r * cos(theta), by = cy + r * sin(theta);
  // A tekercs síkja (a két vezetőt összekötő vonal) – fénykép mellett vékonyabb / the coil plane – thinner over the photo
  line(ax, ay, bx, by, {stroke: P.photo ? "#ffd27a" : C.copper, lw: P.photo ? 3 : 6, alpha: P.photo ? 0.7 : 0.85});
  if (!P.photo) circle(cx, cy, 11, {fill: C.ink});

  // A jobb oldali vezetőben az áram kifelé folyik (U > 0) / current flows out of the page on the right
  const dA = sign(I) * (cos(theta) >= 0 ? 1 : -1);

  if (P.forces) {
    const l = sqrt(P.A * 1e-4);           // vezetőhossz / conductor length [m]
    const F = abs(P.N * P.B * I * l);     // F = N·B·I·l
    const L = min(150, F * 5);
    if (L > 3) {
      vector(ax, ay, 0, -dA * L, {stroke: C.red, lw: 3, id: "Lorentz-erő F"}, "F");
      vector(bx, by, 0, dA * L, {stroke: C.red, lw: 3, id: "Lorentz-erő F"}, "F");
    }
  }
  current(ax, ay, dA, 17, {stroke: C.orange, lw: 3});
  current(bx, by, -dA, 17, {stroke: C.teal, lw: 3});

  // Forgásirány / direction of rotation
  if (abs(omega) > 0.3) {
    const R2 = r + (P.photo ? 50 : 30);   // a fénykép szélén kívül / outside the photo's edge
    arc(cx, cy, R2, -2.2, -0.95, {stroke: C.ink, lw: 2});
    const a1 = omega > 0 ? -2.2 : -0.95, a0 = a1 + (omega > 0 ? 0.2 : -0.2);
    arrow(cx + R2 * cos(a0), cy + R2 * sin(a0), cx + R2 * cos(a1), cy + R2 * sin(a1), {stroke: C.ink, lw: 2, id: "forgásirány ω"});
    text("ω", cx, cy - R2 - 10, {size: 19, italic: true, align: "center"});
  }

  // Kommutátor: a szegmensek a tekerccsel együtt forognak / commutator segments turn with the coil
  const kx = 830, ky = 250, kr = 44, gap = 0.2;
  rect(kx - kr - 32, ky - 13, 24, 26, {fill: "#5b6472", radius: 3});
  rect(kx + kr + 8, ky - 13, 24, 26, {fill: "#5b6472", radius: 3});
  arc(kx, ky, kr, -theta - PI / 2 + gap, -theta + PI / 2 - gap, {stroke: C.orange, lw: 16});
  arc(kx, ky, kr, -theta + PI / 2 + gap, -theta + 3 * PI / 2 - gap, {stroke: C.teal, lw: 16});
  circle(kx, ky, 9, {fill: C.ink});
  text({hu: "kommutátor", en: "commutator"}, kx, ky - kr - 24, {size: 14, color: C.gray, align: "center"});
  text({hu: "kefe", en: "brush"}, kx + kr + 20, ky + 34, {size: 12, color: C.gray, align: "center"});
  text({hu: "kefe", en: "brush"}, kx - kr - 20, ky + 34, {size: 12, color: C.gray, align: "center"});

  // Áramkör és telep / circuit and battery
  const yb = 470, xR = 846, xL = 814;
  polyline([[kx + kr + 32, ky], [910, ky], [910, yb], [xR, yb]], {stroke: C.ink, lw: 2});
  polyline([[kx - kr - 32, ky], [750, ky], [750, yb], [xL, yb]], {stroke: C.ink, lw: 2});
  const pos = P.U >= 0 ? xR : xL, neg = P.U >= 0 ? xL : xR;
  line(pos, yb - 30, pos, yb + 30, {stroke: C.ink, lw: 3});
  line(neg, yb - 15, neg, yb + 15, {stroke: C.ink, lw: 8});
  text("+", pos + (pos > neg ? 14 : -14), yb - 28, {size: 20, bold: true, align: "center"});
  text("−", neg + (pos > neg ? -16 : 16), yb - 28, {size: 20, bold: true, align: "center"});
  text("U = " + fmt(P.U, 1) + " V", 830, yb + 60, {size: 16, align: "center"});
  if (abs(I) > 0.01) {
    arrow(910, I > 0 ? 400 : 350, 910, I > 0 ? 350 : 400, {stroke: C.red, lw: 3, id: "áram I (vezeték)"});
    text("I", 926, 380, {size: 18, italic: true, bold: true, color: C.red});
  }

  // Mért értékek / readouts
  const k = P.N * P.B * P.A * 1e-4;
  const n = omega * 30 / PI;
  val({e, I, M, n});   // a Jelölők fül ezeket használhatja / available to the Markup tab
  // Mért értékek a Vezérlők fülön / Readouts on the Controls tab
  show({hu: "Áram I", en: "Current I"}, I, "A");
  show({hu: "Ellen-EMF e", en: "Back-EMF e"}, e, "V");
  show({hu: "Nyomaték M", en: "Torque M"}, M, "N·m");
  show({hu: "Fordulatszám n", en: "Speed n"}, n, "1/min");
  show({hu: "Felvett teljesítmény U·I", en: "Electrical input U·I"}, P.U * I, "W");
  show({hu: "Mechanikai teljesítmény M·ω", en: "Mechanical output M·ω"}, M * omega, "W");
  show({hu: "Motorállandó k = N·B·A", en: "Motor constant k = N·B·A"}, k, "V·s");
  if (k > 0) show({hu: "Üresjárási fordulatszám (elmélet)", en: "No-load speed (theory)"}, 4 * P.U / (PI * k) * 30 / PI, "1/min");

  // Élő grafikonok a vászon alatt / Live charts under the canvas
  plot({hu: "Fordulatszám n", en: "Speed n"}, n, {unit: "1/min", color: C.blue});
  plot({hu: "Áram I", en: "Current I"}, I, {unit: "A", color: C.orange});
  plot({hu: "Nyomaték M", en: "Torque M"}, M, {unit: "N·m", color: C.red});
});
</script>
